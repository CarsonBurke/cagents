<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ceditor" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A55"/>
      <stop offset="1" stop-color="#EE5A24"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74CCBC"/>
      <stop offset="1" stop-color="#46988A"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8FB2"/>
      <stop offset="1" stop-color="#5A6B8C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B0D14" flood-opacity=".35"/>
    </filter>
    <linearGradient id="obs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4660"/>
      <stop offset=".5" stop-color="#2A3245"/>
      <stop offset="1" stop-color="#222939"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <!-- Scaled so the fanned pages keep the icon grid's 8 px margin -->
  <g transform="translate(64 64) scale(.88) translate(-67.3 -63.4)">
    <!-- Back page -->
    <g filter="url(#sh)" transform="rotate(8 72 59)">
      <rect x="30" y="14" width="84" height="98" rx="8" fill="#11151F"/>
      <rect x="30" y="10" width="84" height="98" rx="8" fill="url(#obs)"/>
      <path d="M 38 10 H 106 A 8 8 0 0 1 114 18 V 25 H 30 V 18 A 8 8 0 0 1 38 10 Z" fill="url(#coral)"/>
      <rect x="30" y="10" width="84" height="15" rx="8" fill="url(#gloss)"/>
      <rect x="30.8" y="10.8" width="82.4" height="96.4" rx="7.2" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    </g>
    <!-- Middle page -->
    <g filter="url(#sh)" transform="rotate(-6 62 63)">
      <rect x="20" y="18" width="84" height="98" rx="8" fill="#11151F"/>
      <rect x="20" y="14" width="84" height="98" rx="8" fill="url(#obs)"/>
      <path d="M 28 14 H 96 A 8 8 0 0 1 104 22 V 29 H 20 V 22 A 8 8 0 0 1 28 14 Z" fill="url(#slate)"/>
      <rect x="20" y="14" width="84" height="15" rx="8" fill="url(#gloss)"/>
      <rect x="20.8" y="14.8" width="82.4" height="96.4" rx="7.2" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    </g>
    <!-- Front page: code with the active line and caret -->
    <g filter="url(#sh)">
      <rect x="22" y="18" width="84" height="98" rx="8" fill="#11151F"/>
      <rect x="22" y="14" width="84" height="98" rx="8" fill="url(#obs)"/>
      <path d="M 30 14 H 98 A 8 8 0 0 1 106 22 V 29 H 22 V 22 A 8 8 0 0 1 30 14 Z" fill="url(#teal)"/>
      <rect x="22" y="14" width="84" height="15" rx="8" fill="url(#gloss)"/>
      <rect x="22.8" y="14.8" width="82.4" height="96.4" rx="7.2" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
      <rect x="23" y="61" width="82" height="11" fill="#6CC2B3" opacity=".16"/>
      <rect x="34" y="40" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="44" y="40" width="22" height="5" rx="2.5" fill="#FF7A48" opacity="0.95"/>
      <rect x="34" y="52" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="52" y="52" width="36" height="5" rx="2.5" fill="#6CC2B3" opacity="1"/>
      <rect x="34" y="64" width="4" height="5" rx="1.5" fill="#6CC2B3"/>
      <rect x="52" y="64" width="24" height="5" rx="2.5" fill="#F2F4F8" opacity="1"/>
      <rect x="34" y="76" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="52" y="76" width="30" height="5" rx="2.5" fill="#8EA4C8" opacity="0.85"/>
      <rect x="34" y="88" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="44" y="88" width="16" height="5" rx="2.5" fill="#5E6B85" opacity="1"/>
      <!-- I-beam caret at the end of the active line -->
      <g transform="translate(42.8 30.1) scale(.4)">
        <path d="M 84 70 H 112 V 78 H 102 V 104 H 112 V 112 H 84 V 104 H 94 V 78 H 84 Z" fill="#B83D16" transform="translate(0 4)"/>
        <path d="M 84 70 H 112 V 78 H 102 V 104 H 112 V 112 H 84 V 104 H 94 V 78 H 84 Z" fill="url(#coral)" stroke="#B83D16" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
