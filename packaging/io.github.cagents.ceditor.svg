<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ceditor" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Machined gunmetal 2.5D bottom extrusion with horizontal brushed metallic sheen -->
    <linearGradient id="dark-side" x1="10" y1="104" x2="118" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222B3B"/>
      <stop offset="18%" stop-color="#3C485E"/>
      <stop offset="50%" stop-color="#4B5870"/>
      <stop offset="82%" stop-color="#3C485E"/>
      <stop offset="100%" stop-color="#222B3B"/>
    </linearGradient>
    <linearGradient id="dark-side-shade" x1="64" y1="98" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.36"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="82%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="dark-face" x1="64" y1="10" x2="64" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#343F54"/>
      <stop offset="32%" stop-color="#232B3C"/>
      <stop offset="100%" stop-color="#181E2B"/>
    </linearGradient>
    <linearGradient id="dark-rim" x1="64" y1="10" x2="64" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.44"/>
      <stop offset="26%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="teal-side" x1="0" y1="88" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#347A70"/>
      <stop offset="100%" stop-color="#255E56"/>
    </linearGradient>
    <linearGradient id="teal-top" x1="0" y1="16" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64B8AA"/>
      <stop offset="100%" stop-color="#459689"/>
    </linearGradient>
    <linearGradient id="slate-side" x1="0" y1="88" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222C3E"/>
      <stop offset="100%" stop-color="#171F2E"/>
    </linearGradient>
    <linearGradient id="slate-top" x1="0" y1="16" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F4F6B"/>
      <stop offset="100%" stop-color="#2B374D"/>
    </linearGradient>
    <filter id="key-sh" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="2.0" stdDeviation="1.6" flood-color="#05080F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Single-wrap dark machined obsidian 2.5D chassis -->
  <!-- 2.5D Orthographic machined gunmetal extrusion lip -->
  <rect x="10" y="18" width="108" height="101" rx="18" fill="url(#dark-side)"/>
  <rect x="10" y="18" width="108" height="101" rx="18" fill="url(#dark-side-shade)"/>
  <rect x="10.75" y="18.75" width="106.5" height="99.5" rx="17.25" fill="none" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- Main satin obsidian top face with crisp front-edge chamfer highlight -->
  <rect x="10" y="10" width="108" height="101" rx="18" fill="url(#dark-face)"/>
  <rect x="11" y="11" width="106" height="99" rx="17" fill="none" stroke="url(#dark-rim)" stroke-width="2"/>

  <!-- Left slim tactile gutter rail (Cool Teal-Mint) -->
  <g filter="url(#key-sh)">
    <rect x="18" y="24" width="21" height="80" rx="7.5" fill="url(#teal-side)"/>
    <rect x="18" y="18" width="21" height="78" rx="7.5" fill="url(#teal-top)"/>
    <rect x="18.7" y="18.7" width="19.6" height="76.6" rx="6.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.3"/>
    <rect x="25" y="30.5" width="7" height="4.2" rx="2.1" fill="#D5F7F0" opacity="0.65"/>
    <rect x="25" y="43.5" width="7" height="4.2" rx="2.1" fill="#D5F7F0" opacity="0.65"/>
    <rect x="25" y="56.5" width="7" height="4.2" rx="2.1" fill="#FFFFFF" opacity="0.98"/>
    <rect x="25" y="69.5" width="7" height="4.2" rx="2.1" fill="#D5F7F0" opacity="0.65"/>
    <rect x="25" y="82.5" width="7" height="4.2" rx="2.1" fill="#D5F7F0" opacity="0.42"/>
  </g>

  <!-- Right wide tactile editor plate (Deep Slate-Navy) -->
  <g filter="url(#key-sh)">
    <rect x="43" y="24" width="67" height="80" rx="8" fill="url(#slate-side)"/>
    <rect x="43" y="18" width="67" height="78" rx="8" fill="url(#slate-top)"/>
    <rect x="43.7" y="18.7" width="65.6" height="76.6" rx="7.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.3"/>
    <!-- Chunky iconic syntax bars -->
    <rect x="51" y="30.5" width="28" height="5.2" rx="2.6" fill="#93AACF" opacity="0.86"/>
    <rect x="51" y="43.5" width="44" height="5.2" rx="2.6" fill="#6EC4B6" opacity="0.94"/>
    <!-- Active edited line + focal coral-orange caret block -->
    <rect x="51" y="56.5" width="30" height="5.2" rx="2.6" fill="#F8FAFC"/>
    <rect x="86" y="51.2" width="7.0" height="15.6" rx="2.8" fill="#FF6F3C"/>
    <rect x="51" y="69.5" width="37" height="5.2" rx="2.6" fill="#93AACF" opacity="0.72"/>
    <rect x="51" y="82.5" width="21" height="5.2" rx="2.6" fill="#93AACF" opacity="0.46"/>
  </g>
</svg>
