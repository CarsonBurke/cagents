<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ceditor" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A55"/>
      <stop offset="1" stop-color="#EE5A24"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74CCBC"/>
      <stop offset="1" stop-color="#46988A"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8FB2"/>
      <stop offset="1" stop-color="#5A6B8C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B0D14" flood-opacity=".35"/>
    </filter>
    <linearGradient id="obs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4660"/>
      <stop offset=".5" stop-color="#2A3245"/>
      <stop offset="1" stop-color="#222939"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <!-- Fanned pages scaled to the 120 px live area COSMIC icons use, shadows included -->
  <g transform="translate(64 64) scale(1.034) translate(-50.0 -46.5)">
    <!-- Back page -->
    <g filter="url(#sh)" transform="rotate(7 56.0 41.0)">
      <rect x="10" y="0" width="92" height="90" rx="8" fill="#11151F"/>
      <rect x="10" y="-4" width="92" height="90" rx="8" fill="url(#obs)"/>
      <path d="M 18 -4 H 94 A 8 8 0 0 1 102 4 V 11 H 10 V 4 A 8 8 0 0 1 18 -4 Z" fill="url(#coral)"/>
      <rect x="10" y="-4" width="92" height="15" rx="8" fill="url(#gloss)"/>
      <rect x="10.8" y="-3.2" width="90.4" height="88.4" rx="7.2" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    </g>
    <!-- Middle page -->
    <g filter="url(#sh)" transform="rotate(-5 44.0 45.0)">
      <rect x="-2" y="4" width="92" height="90" rx="8" fill="#11151F"/>
      <rect x="-2" y="0" width="92" height="90" rx="8" fill="url(#obs)"/>
      <path d="M 6 0 H 82 A 8 8 0 0 1 90 8 V 15 H -2 V 8 A 8 8 0 0 1 6 0 Z" fill="url(#slate)"/>
      <rect x="-2" y="0" width="92" height="15" rx="8" fill="url(#gloss)"/>
      <rect x="-1.2" y="0.8" width="90.4" height="88.4" rx="7.2" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    </g>
    <!-- Front page: code with the active line and caret -->
    <g filter="url(#sh)">
      <rect x="0" y="4" width="92" height="90" rx="8" fill="#11151F"/>
      <rect x="0" y="0" width="92" height="90" rx="8" fill="url(#obs)"/>
      <path d="M 8 0 H 84 A 8 8 0 0 1 92 8 V 15 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="url(#teal)"/>
      <rect x="0" y="0" width="92" height="15" rx="8" fill="url(#gloss)"/>
      <rect x="0.8" y="0.8" width="90.4" height="88.4" rx="7.2" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
      <rect x="12" y="26.0" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="23.0" y="26.0" width="24.1" height="5" rx="2.5" fill="#FF7A48" opacity="0.95"/>
      <rect x="12" y="38.0" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="42.7" y="38.0" width="39.4" height="5" rx="2.5" fill="#6CC2B3" opacity="1"/>
      <rect x="1" y="47.0" width="90" height="11" fill="#6CC2B3" opacity=".16"/>
      <rect x="12" y="50.0" width="4" height="5" rx="1.5" fill="#6CC2B3"/>
      <rect x="42.7" y="50.0" width="26.3" height="5" rx="2.5" fill="#F2F4F8" opacity="1"/>
      <!-- I-beam caret at the end of the active line -->
      <g transform="translate(36.4 16.1) scale(.4)">
        <path d="M 84 70 H 112 V 78 H 102 V 104 H 112 V 112 H 84 V 104 H 94 V 78 H 84 Z" fill="#B83D16" transform="translate(0 4)"/>
        <path d="M 84 70 H 112 V 78 H 102 V 104 H 112 V 112 H 84 V 104 H 94 V 78 H 84 Z" fill="url(#coral)" stroke="#B83D16" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
      <rect x="12" y="62.0" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="42.7" y="62.0" width="32.9" height="5" rx="2.5" fill="#8EA4C8" opacity="0.85"/>
      <rect x="12" y="74.0" width="4" height="5" rx="1.5" fill="#4A5570"/>
      <rect x="23.0" y="74.0" width="17.5" height="5" rx="2.5" fill="#5E6B85" opacity="1"/>
    </g>
  </g>
</svg>
