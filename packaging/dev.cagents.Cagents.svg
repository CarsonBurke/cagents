<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cagents" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Brushed warm-titanium outer chassis -->
    <linearGradient id="deck-side" x1="64" y1="84" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A847D"/>
      <stop offset="55%" stop-color="#6E6963"/>
      <stop offset="100%" stop-color="#58544F"/>
    </linearGradient>
    <linearGradient id="deck-face" x1="64" y1="10" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCD8D2"/>
      <stop offset="18%" stop-color="#C8C3BC"/>
      <stop offset="82%" stop-color="#A39D95"/>
      <stop offset="100%" stop-color="#918B83"/>
    </linearGradient>
    <linearGradient id="deck-rim" x1="64" y1="10" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <!-- Recessed dark bay -->
    <linearGradient id="bay-bg" x1="64" y1="20" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#1D2534"/>
    </linearGradient>

    <!-- Lane 1: Deep Slate-Navy key -->
    <linearGradient id="l1-side" x1="0" y1="84" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222C3E"/>
      <stop offset="100%" stop-color="#1A2232"/>
    </linearGradient>
    <linearGradient id="l1-top" x1="0" y1="24" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3C4B66"/>
      <stop offset="100%" stop-color="#2A364B"/>
    </linearGradient>

    <!-- Lane 2: Cool Teal-Mint key -->
    <linearGradient id="l2-side" x1="0" y1="84" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#357A70"/>
      <stop offset="100%" stop-color="#28635A"/>
    </linearGradient>
    <linearGradient id="l2-top" x1="0" y1="24" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60B2A4"/>
      <stop offset="100%" stop-color="#469689"/>
    </linearGradient>

    <!-- Lane 3: Focal Coral-Orange key (Apostrophe-style accent!) -->
    <linearGradient id="l3-side" x1="0" y1="84" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C84418"/>
      <stop offset="100%" stop-color="#A83510"/>
    </linearGradient>
    <linearGradient id="l3-top" x1="0" y1="24" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7847"/>
      <stop offset="45%" stop-color="#F85F2A"/>
      <stop offset="100%" stop-color="#E64F1E"/>
    </linearGradient>

    <filter id="key-sh" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#05080F" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 2.5D Orthographic bottom extrusion lip (classic GNOME HIG depth) -->
  <rect x="10" y="18" width="108" height="101" rx="18" fill="url(#deck-side)"/>

  <!-- Main anodized titanium top face -->
  <rect x="10" y="10" width="108" height="101" rx="18" fill="url(#deck-face)"/>
  <rect x="11" y="11" width="106" height="99" rx="17" fill="none" stroke="url(#deck-rim)" stroke-width="2"/>

  <!-- Recessed obsidian key bay -->
  <rect x="19" y="19" width="90" height="83" rx="11" fill="url(#bay-bg)"/>
  <rect x="19.75" y="19.75" width="88.5" height="81.5" rx="10.25" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- LANE 1: Deep Slate-Navy tactile module -->
  <g filter="url(#key-sh)">
    <rect x="24" y="29" width="24" height="68" rx="6" fill="url(#l1-side)"/>
    <rect x="24" y="24" width="24" height="66" rx="6" fill="url(#l1-top)"/>
    <rect x="24.6" y="24.6" width="22.8" height="64.8" rx="5.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>
    <!-- Status bar -->
    <rect x="29.5" y="30" width="13" height="3.2" rx="1.6" fill="#7D91B3" opacity="0.85"/>
  </g>

  <!-- LANE 2: Cool Teal-Mint tactile module -->
  <g filter="url(#key-sh)">
    <rect x="52" y="29" width="24" height="68" rx="6" fill="url(#l2-side)"/>
    <rect x="52" y="24" width="24" height="66" rx="6" fill="url(#l2-top)"/>
    <rect x="52.6" y="24.6" width="22.8" height="64.8" rx="5.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="1.2"/>
    <!-- Status bar -->
    <rect x="57.5" y="30" width="13" height="3.2" rx="1.6" fill="#B5EFE4" opacity="0.95"/>
  </g>

  <!-- LANE 3: Focal Coral-Orange active agent key -->
  <g filter="url(#key-sh)">
    <rect x="80" y="29" width="24" height="68" rx="6" fill="url(#l3-side)"/>
    <rect x="80" y="24" width="24" height="66" rx="6" fill="url(#l3-top)"/>
    <rect x="80.6" y="24.6" width="22.8" height="64.8" rx="5.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="1.2"/>
    <!-- Crisp prompt chevron > -->
    <path d="M 88.8 50.5 L 95.8 57.5 L 88.8 64.5" fill="none" stroke="#FFF7ED" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
