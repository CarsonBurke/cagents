<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cagents" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="slate-side" x1="0" y1="88" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222C3E"/>
      <stop offset="100%" stop-color="#171F2E"/>
    </linearGradient>
    <linearGradient id="slate-top" x1="0" y1="16" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F4F6B"/>
      <stop offset="100%" stop-color="#2B374D"/>
    </linearGradient>
    <linearGradient id="teal-side" x1="0" y1="88" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#347A70"/>
      <stop offset="100%" stop-color="#255E56"/>
    </linearGradient>
    <linearGradient id="teal-top" x1="0" y1="16" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64B8AA"/>
      <stop offset="100%" stop-color="#459689"/>
    </linearGradient>
    <linearGradient id="coral-side" x1="0" y1="88" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C84418"/>
      <stop offset="100%" stop-color="#A4320D"/>
    </linearGradient>
    <linearGradient id="coral-top" x1="0" y1="16" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A48"/>
      <stop offset="45%" stop-color="#F85F2A"/>
      <stop offset="100%" stop-color="#E34C1A"/>
    </linearGradient>
    <linearGradient id="ivory-side" x1="0" y1="88" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8C3BA"/>
      <stop offset="100%" stop-color="#ACA69C"/>
    </linearGradient>
    <linearGradient id="ivory-top" x1="0" y1="16" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#EAE5DC"/>
    </linearGradient>
    <filter id="key-sh" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="2.0" stdDeviation="1.6" flood-color="#05080F" flood-opacity="0.45"/>
    </filter>
    <filter id="key-sh-light" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="2.0" stdDeviation="1.6" flood-color="#1E1C1A" flood-opacity="0.28"/>
    </filter>

    <!-- Natural top-lit 2.5D gunmetal extrusion: slightly darker than top face, readable on dark docks -->
    <linearGradient id="dark-side" x1="10" y1="104" x2="118" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A212E"/>
      <stop offset="22%" stop-color="#263042"/>
      <stop offset="50%" stop-color="#2D384D"/>
      <stop offset="78%" stop-color="#263042"/>
      <stop offset="100%" stop-color="#1A212E"/>
    </linearGradient>
    <linearGradient id="dark-side-shade" x1="64" y1="102" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="dark-face" x1="64" y1="10" x2="64" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#384358"/>
      <stop offset="45%" stop-color="#293245"/>
      <stop offset="100%" stop-color="#222A3B"/>
    </linearGradient>
    <linearGradient id="dark-rim" x1="64" y1="10" x2="64" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="24%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="84%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
</defs>
  
  <!-- 2.5D Orthographic machined gunmetal extrusion lip -->
  <rect x="10" y="18" width="108" height="101" rx="18" fill="url(#dark-side)"/>
  <rect x="10" y="18" width="108" height="101" rx="18" fill="url(#dark-side-shade)"/>
  <rect x="10.75" y="18.75" width="106.5" height="99.5" rx="17.25" fill="none" stroke="#94A3B8" stroke-opacity="0.12" stroke-width="1.2"/>
  <!-- Main satin obsidian top face with crisp front-edge chamfer highlight -->
  <rect x="10" y="10" width="108" height="101" rx="18" fill="url(#dark-face)"/>
  <rect x="11" y="11" width="106" height="99" rx="17" fill="none" stroke="url(#dark-rim)" stroke-width="2"/>

  <!-- Bigger, bolder 3-lane modules (width 28 each, height 84) directly on the dark deck -->
  <g filter="url(#key-sh)">
    <rect x="18" y="24" width="28" height="80" rx="8" fill="url(#slate-side)"/>
    <rect x="18" y="18" width="28" height="78" rx="8" fill="url(#slate-top)"/>
    <rect x="18.7" y="18.7" width="26.6" height="76.6" rx="7.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.3"/>
    <rect x="24.5" y="25.5" width="15" height="3.8" rx="1.9" fill="#8EA4C8" opacity="0.88"/>
  </g>
  <g filter="url(#key-sh)">
    <rect x="50" y="24" width="28" height="80" rx="8" fill="url(#teal-side)"/>
    <rect x="50" y="18" width="28" height="78" rx="8" fill="url(#teal-top)"/>
    <rect x="50.7" y="18.7" width="26.6" height="76.6" rx="7.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.3"/>
    <rect x="56.5" y="25.5" width="15" height="3.8" rx="1.9" fill="#C4F5EC" opacity="0.96"/>
  </g>
  <g filter="url(#key-sh)">
    <rect x="82" y="24" width="28" height="80" rx="8" fill="url(#coral-side)"/>
    <rect x="82" y="18" width="28" height="78" rx="8" fill="url(#coral-top)"/>
    <rect x="82.7" y="18.7" width="26.6" height="76.6" rx="7.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="1.3"/>
    <path d="M 92.2 49.0 L 100.2 57.0 L 92.2 65.0" fill="none" stroke="#FFF7ED" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
