[workspace]
members = [".", "crates/ceditor"]
# Existing root build lanes keep their isolated feature graphs.
default-members = ["."]
resolver = "3"

[package]
name = "cagents"
version = "0.1.3"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[features]
default = ["full"]
development = []
# Opt-in local redraw-scheduling fixture; ordinary builds use a zero-state recorder.
latency-harness = ["ui"]
# Product identity only. Keep this separate from the embedded-browser
# implementation so the CLI and daemon do not resolve Servo.
full = []
host = [
    "dep:base64",
    "dep:image",
    "dep:ksni",
    "dep:libghostty-vt",
    "dep:portable-pty",
    "dep:rusqlite",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:tungstenite",
]
ui = [
    "dep:base64",
    "dep:ashpd",
    "dep:async-channel",
    "dep:async-lsp",
    "dep:blake3",
    "dep:hayro",
    "dep:iced_accessibility",
    "dep:image",
    "image/jpeg",
    "image/gif",
    "image/webp",
    "image/bmp",
    "image/ico",
    "image/tiff",
    "dep:imara-diff",
    "dep:libcosmic",
    "dep:lsp-types",
    "dep:resvg",
    "dep:roxmltree",
    "dep:rusqlite",
    "dep:tempfile",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing-subscriber",
    "dep:two-face",
    "dep:unicode-linebreak",
    "dep:unicode-casefold",
    "dep:yaml-rust",
]
integrated-browser = [
    "full",
    "ui",
    "dep:dpi",
    "dep:euclid",
    "dep:keyboard-types",
    "dep:raw-window-handle",
    "dep:servo",
    "dep:wayland-client",
    "dep:wayland-protocols",
]

[[bin]]
name = "cagents"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "cagents-ui"
path = "src/bin/cagents-ui.rs"
test = false
bench = false
required-features = ["ui"]

[[bin]]
name = "cagentsd"
path = "src/bin/cagentsd.rs"
test = false
bench = false
required-features = ["host"]

[dependencies]
yaml-rust = { version = "0.4.5", optional = true }
unicode-casefold = { version = "0.2", optional = true }
unicode-linebreak = { version = "0.1", optional = true }
arc-swap = "1.7"
async-channel = { version = "2.5", optional = true }
ashpd = { version = "0.12.3", default-features = false, features = ["tokio", "wayland"], optional = true }
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tracing"], optional = true }
base64 = { version = "0.22", optional = true }
bitflags = { version = "2.9", features = ["serde"] }
blake3 = { version = "1.8", optional = true }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
dpi = { version = "=0.1.2", optional = true }
directories = "6.0"
euclid = { version = "=0.22.14", optional = true }
# Pure-Rust PDF rendering. The editor previews a PDF the same way it previews
# an SVG, by rasterizing to RGBA off the UI thread, so a document in a
# worktree opens in place instead of handing the reader to an external viewer.
# Only the `ui` lane resolves it; the CLI and the daemon never parse a PDF.
hayro = { version = "0.7.1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
iced_accessibility = { git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d", optional = true }
keyboard-types = { version = "=0.8.3", features = ["serde"], optional = true }
# `highlighter` backs the editor's syntax highlighting; it is not in libcosmic's
# default set and the editor is the only consumer.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d", default-features = false, features = ["a11y", "highlighter", "markdown", "multi-window", "surface-message", "tokio", "wayland", "wgpu", "winit", "xdg-portal"], optional = true }
imara-diff = { version = "0.2.0", optional = true }
ksni = { version = "0.3.6", optional = true }
libc = "0.2.189"
libghostty-vt = { version = "0.2.1", default-features = false, features = ["tracing"], optional = true }
# Pinned to the version `async-lsp` 0.2.4 depends on so protocol types unify.
lsp-types = { version = "0.95", optional = true }
portable-pty = { version = "0.9", features = ["serde_support"], optional = true }
# Binary IPC codec. The terminal snapshot protocol is a per-frame, per-cell
# binary payload; a self-describing text format costs ~24x more bytes and one
# heap allocation per character cell on both sides. postcard is already in the
# resolved dependency graph, needs no additional crates, and its externally
# tagged enum encoding is why the wire enums below carry no `serde(tag)`.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"], optional = true }
roxmltree = { version = "0.20", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
semver = { version = "1.0", features = ["serde"] }
serde_bytes = "0.11"
serde_ignored = "0.1"
serde_json = "1.0"
serde_path_to_error = "0.1"
sha2 = "0.10"
servo = { version = "=0.1.3", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282", default-features = false, features = ["baked-in-resources", "js_jit"], optional = true }
thiserror = "2.0"
tempfile = { version = "3.21", optional = true }
tokio = { version = "1.47", features = ["fs", "process", "rt-multi-thread", "sync", "time"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
toml = { version = "1.1.4", features = ["preserve_order"] }
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"], optional = true }
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"], optional = true }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
wayland-client = { version = "=0.31.15", features = ["system"], optional = true }
wayland-protocols = { version = "=0.32.13", features = ["client"], optional = true }

[dev-dependencies]
tempfile = "3.21"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
debug = 0

[profile.dev.package."libghostty-vt-sys"]
debug = "line-tables-only"

[profile.dev-runtime]
inherits = "dev"

[profile.dev-runtime.package."*"]
opt-level = 2
debug = 0

[profile.dev-runtime.package."libghostty-vt-sys"]
opt-level = 2
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = 0

[profile.test.package."libghostty-vt-sys"]
debug = "line-tables-only"

[patch."https://github.com/pop-os/winit.git"]
winit-wayland = { path = "vendor/winit-wayland" }
