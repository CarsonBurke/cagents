# The supported command interface for developing, checking, testing and
# packaging cagents: `mise tasks` lists it and `mise run TASK --help` explains a
# task. Tasks compose the scripts in scripts/, which keep the process, build
# admission and verification logic; Cargo keeps dependency resolution and
# compilation. See docs/development.md#tasks.

[tools]
zig = "0.15.2"

# Each implementation graph is its own Cargo invocation. Cargo features are
# package-wide, so no task combines `host` with `ui`. The host lane selects the
# shared library and cagents-host, the daemon built on it. The UI lanes select
# the cagents-ui package, which holds the application, and cagents-ui-kit, its
# widgets and views; `ui` also selects the shared library, so one invocation
# covers every package's targets in that graph.
[vars]
cli = "--locked --no-default-features"
host = "--locked --no-default-features --package cagents --package cagents-host --features cagents/host"
ui = "--locked --no-default-features --package cagents --package cagents-ui --package cagents-ui-kit --features cagents/ui"
# The integrated browser with its Wayland registry test server, which the
# browser tests use, as main's build check selects it.
browser = "--locked --no-default-features --package cagents-ui --package cagents-ui-kit --features cagents-ui/browser-protocol-fixture"
editor = "--locked --package ceditor"
# The dictation helper with its speech engine: onnxruntime, audio capture and
# model downloads, which no other lane resolves.
dictate = "--locked --no-default-features --package cagents-dictate --features engine"

# Usage specs. A lane task forwards Cargo arguments; naming any replaces the
# default target selection, so `-- --lib terminal::` narrows a lane instead of
# adding to it. mise passes them shell-quoted in $usage_cargo_args, and each
# lane task restores them with `eval "set -- $usage_cargo_args"`. An aggregate
# refuses arguments rather than silently running every lane whole: narrow one
# lane instead, such as `mise run test:host -- --lib terminal::`. Its first step
# checks, since mise would expand a $ in a spec kept here in [vars].
# Each task spells its spec out rather than naming a var: mise 2025.9.9
# renders {{vars.*}} in `run` but passes a `usage` value verbatim, which then
# fails to parse as KDL once the task is given arguments or --help.

# Setup ----------------------------------------------------------------------

[tasks.setup]
description = "Install the pinned Zig and Rust toolchains, then run the doctor"
run = [
  "mise install",
  'command -v rustup >/dev/null || { echo "rustup is required to install Rust: https://rustup.rs/" >&2; exit 1; }',
  # The channel, profile and components rust-toolchain.toml names, spelled out
  # for rustup releases that cannot read the file. Updating rustup itself stays
  # the user's decision.
  '''eval "set -- $(/usr/bin/python3 -I -c 'import shlex, tomllib; t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]; print(shlex.join([t["channel"], "--profile", t.get("profile", "minimal"), *(f"--component={c}" for c in t.get("components", ()))]))')" && rustup toolchain install --no-self-update "$@"''',
]
depends_post = ["doctor"]

[tasks.doctor]
description = "Report missing prerequisites and whether the build host answers"
run = "scripts/doctor"

# Development ----------------------------------------------------------------
# The runner builds the matched CLI, UI and daemon through the build gate and
# runs them as the isolated development instance. `raw` keeps the terminal
# attached so Ctrl+C and the runner's prompts reach it.

[tasks.dev]
description = "Run the browserless development UI (arguments go to scripts/run-development)"
raw = true
run = "scripts/run-development --browserless"

[tasks."dev:browser"]
description = "Run the development UI with the embedded Servo browser"
raw = true
run = "scripts/run-development"

# Checks ---------------------------------------------------------------------
# Every compiling command goes through scripts/cargo-gate, which admits it to a
# build slot on the build host. Cargo decides what is stale; nothing here is
# task-cached. A lane's checks and tests run the gate through scripts/cargo-lane,
# which fails them on the workspace's own warnings, as main's build check does,
# and leaves out the vendored crates' warnings.

[tasks."check:cli"]
description = "Type-check and lint the control CLI lane"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane clippy {{vars.cli}} "$@"'

[tasks."check:host"]
description = "Type-check and lint the terminal daemon lane: the daemon and the shared library it builds on"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane clippy {{vars.host}} "$@"'

[tasks."check:ui"]
description = "Type-check and lint the browserless UI lane"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane clippy {{vars.ui}} "$@"'

[tasks."check:browser"]
description = "Type-check and lint the integrated-browser UI lane"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane clippy {{vars.browser}} "$@"'

[tasks."check:editor"]
description = "Type-check and lint the standalone ceditor package"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--bin=ceditor" help="Cargo arguments, after --; they replace the default --bin=ceditor"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane clippy {{vars.editor}} "$@"'

[tasks."check:dictate"]
description = "Type-check and lint the dictation helper lane"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane clippy {{vars.dictate}} "$@"'

[tasks."check:macos:cli"]
description = "Type-check and lint the control CLI lane for Apple Silicon macOS on the build host, without a Mac"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/check-macos cli "$@"'

[tasks."check:macos:host"]
description = "Type-check and lint the terminal daemon lane for Apple Silicon macOS on the build host, without a Mac"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/check-macos host "$@"'

[tasks."check:macos:ui"]
description = "Type-check and lint the browserless UI lane for Apple Silicon macOS on the build host, without a Mac"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/check-macos ui "$@"'

[tasks.check]
description = "Check that each lane resolves only its own graph, then type-check and lint every target of the CLI, host and UI lanes, each admitted on its own"
usage = 'arg "[unexpected]..." var=#true hide=#true'
# The isolation check compiles nothing and takes seconds, so a leaked graph
# fails before three builds start.
run = ['if [ -n "${usage_unexpected-}" ]; then echo "this task takes no arguments; pass them to one of the tasks it runs" >&2; exit 2; fi', { task = "check:isolation" }, { tasks = ["check:cli", "check:host", "check:ui"] }]

[tasks."check:isolation"]
description = "Check without compiling that each lane resolves only its own dependency graph"
run = "scripts/check-lane-isolation"

[tasks."check:protocol"]
description = "Check the IPC source contract, older-client proofs and live-update sources against a base"
usage = 'flag "--base <ref>" help="Comparison base (default: the merge base with origin/main)"'
run = [
  # An empty base would check only the current snapshot, so a missing one fails.
  '''base=${usage_base-}
  if [ -z "$base" ]; then
      base=$(git merge-base HEAD origin/main) || { echo "no merge base with origin/main; fetch it or pass --base REF" >&2; exit 2; }
  fi
  exec scripts/check-protocol-contract --base-ref "$base"''',
  "scripts/check-older-clients",
  "scripts/check-update-sources",
]

# Tests ----------------------------------------------------------------------
# The gate builds each lane's tests in a slot and runs them afterwards under a
# memory limit. HOST tests get their matched daemon helper automatically.
# A lane narrowed with arguments may build its library only under cfg(test),
# where an item only tests use looks used. So once those tests pass, it checks
# the lane's library, binaries and examples as main's build check does.
# Each step execs, so the TERM mise sends a step reaches the gate.

[tasks."test:cli"]
description = "Test the control CLI lane"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = [
  'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane test {{vars.cli}} "$@"',
  'eval "set -- $usage_cargo_args"; case " $* " in *" --all-targets "*) ;; *) exec scripts/cargo-lane clippy {{vars.cli}} --lib --bins --examples ;; esac',
]

[tasks."test:host"]
description = "Test the terminal daemon lane: the daemon and the shared library it builds on"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = [
  'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane test {{vars.host}} "$@"',
  'eval "set -- $usage_cargo_args"; case " $* " in *" --all-targets "*) ;; *) exec scripts/cargo-lane clippy {{vars.host}} --lib --bins --examples ;; esac',
]

[tasks."test:dictate"]
description = "Test the dictation helper lane"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = [
  'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane test {{vars.dictate}} "$@"',
  'eval "set -- $usage_cargo_args"; case " $* " in *" --all-targets "*) ;; *) exec scripts/cargo-lane clippy {{vars.dictate}} --lib --bins --examples ;; esac',
]

[tasks."test:ui"]
description = "Test the browserless UI lane"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" default="--all-targets" help="Cargo arguments, after --; they replace the default --all-targets"'
run = [
  'eval "set -- $usage_cargo_args"; exec scripts/cargo-lane test {{vars.ui}} "$@"',
  'eval "set -- $usage_cargo_args"; case " $* " in *" --all-targets "*) ;; *) exec scripts/cargo-lane clippy {{vars.ui}} --lib --bins --examples ;; esac',
]

[tasks."test:contracts"]
description = "Test the focused vendored-crate contract packages"
usage = 'arg "[cargo_args]..." var=#true double_dash="required" help="Additional Cargo arguments, after --"'
run = 'eval "set -- $usage_cargo_args"; exec scripts/cargo-gate test --locked -p cagents-iced-contracts -p cagents-cosmic-text-contracts "$@"'

[tasks.test]
description = "Test every target of the CLI, host and UI lanes, one lane after another"
# In sequence: each lane's tests run outside the build slot, and three suites
# at once would compete for memory and interleave thousands of result lines.
usage = 'arg "[unexpected]..." var=#true hide=#true'
run = ['if [ -n "${usage_unexpected-}" ]; then echo "this task takes no arguments; pass them to one of the tasks it runs" >&2; exit 2; fi', { task = "test:cli" }, { task = "test:host" }, { task = "test:ui" }]

[tasks."test:lib"]
description = "Build one lane's library tests once and run the named ones (see scripts/test-lib --help)"
run = "scripts/test-lib"

[tasks."test:scripts"]
description = "Verify and run the script contract suites CI runs (optionally one JOB [SHARD])"
usage = '''
flag "--verbose" help="Print every test and each tested file's digest, as CI's log does"
arg "[job]" help="One job, such as tooling; default: every job unsharded, then the source job's suites"
arg "[shard]" help="I/N shard of a sharded job"
'''
run = [
  "/usr/bin/python3 -I -B scripts/script-contracts verify",
  '/usr/bin/python3 -I -B scripts/script-contracts run ${usage_verbose:+--verbose} ${usage_job:+"$usage_job"} ${usage_shard:+"$usage_shard"}',
]

# Formatting -----------------------------------------------------------------

[tasks.fmt]
description = "Format Cargo roots and the Rust sources behind include! in place"
run = "scripts/check-format --write"

[tasks."fmt:check"]
description = "Check formatting without rewriting anything"
run = "scripts/check-format"

# What GitHub CI runs; none of it compiles Rust.
[tasks.ci]
description = "Run the checks GitHub CI runs: formatting, protocol contracts and script suites"
usage = 'arg "[unexpected]..." var=#true hide=#true'
run = ['if [ -n "${usage_unexpected-}" ]; then echo "this task takes no arguments; pass them to one of the tasks it runs" >&2; exit 2; fi', { tasks = ["fmt:check", "check:protocol", "test:scripts"] }]

# Mobile ---------------------------------------------------------------------
# The Android app in mobile/ builds with Gradle on the build host, as Rust
# does: scripts/gradle-remote mirrors mobile/ there, runs one Gradle build
# with no daemon left behind, and brings back the test reports and APKs.
# Installing runs adb here, where the phone is. CAGENTS_BUILD_REMOTE=local
# builds here instead. See mobile/README.md.

[tasks."mobile:test"]
description = "Test the Android app on the build host: the protocol against the recorded API, the client against a fake bridge"
run = 'exec scripts/gradle-remote -- :shared:jvmTest :androidApp:testDebugUnitTest'

[tasks."mobile:build"]
description = "Build the Android app's debug APK on the build host (mobile/androidApp/build/outputs/apk/debug)"
run = 'exec scripts/gradle-remote --fetch androidApp/build/outputs/apk/debug -- :androidApp:assembleDebug'

[tasks."mobile:install"]
description = "Build the minified preview APK on the build host and install it on the connected phone, over the debug build (set ANDROID_SERIAL to choose one)"
run = """
set -e
scripts/gradle-remote --fetch androidApp/build/outputs/apk/preview -- :androidApp:assemblePreview
exec adb install -r "$(ls mobile/androidApp/build/outputs/apk/preview/*.apk | head -n 1)"
"""

[tasks."mobile:install-debug"]
description = "Build the debuggable APK on the build host and install it on the connected phone, for run-as and the debugger; it runs slower"
run = """
set -e
scripts/gradle-remote --fetch androidApp/build/outputs/apk/debug -- :androidApp:assembleDebug
exec adb install -r "$(ls mobile/androidApp/build/outputs/apk/debug/*.apk | head -n 1)"
"""

# Packaging and release ------------------------------------------------------

[tasks.install]
description = "Build the committed HEAD and replace your installed cagents (see scripts/install-local --help)"
raw = true
run = "scripts/install-local"

[tasks.package]
description = "Build and check Linux packages from this checkout (scripts/package-linux.sh)"
run = "scripts/package-linux.sh"

[tasks."package:smoke"]
description = "Install, upgrade and remove fixture packages in a networkless root"
run = "scripts/smoke-package-upgrades"

[tasks.release]
description = "Release a prebuilt bundle: cut, rehearse, publish (scripts/release --help)"
raw = true
run = "scripts/release"

[tasks."release:build"]
description = "Build an exact tag in the glibc-baseline release environment (--ref TAG --output DIR)"
run = "scripts/build-release-linux"

[tasks."release:verify"]
description = "Verify a release bundle without publishing it (--version VERSION --dist DIR)"
run = "scripts/publish-release --verify-only"
