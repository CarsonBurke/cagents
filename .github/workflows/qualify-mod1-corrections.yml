name: Research exact modulo-one corrections

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/qualify-mod1-corrections.yml
      - research/mod1-corrections/manifest.json

permissions:
  contents: read

concurrency:
  group: research-mod1-corrections-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.93.0

jobs:
  qualify:
    if: >-
      github.event.pull_request.head.ref == 'research/mod1-corrections-qualification-b9' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Sequential exact UI and HOST corrections
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Require natural hosted User context and initialize evidence
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/mod1-corrections-evidence"
          install -d -m 700 "$evidence_root"
          printf '%s\n' "MOD1_EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mod1-corrections-evidence"
          present = sorted(name for name in os.environ if name.startswith("CAGENTS_"))
          (root / "context.json").write_text(json.dumps({
              "hosted": os.environ.get("GITHUB_ACTIONS") == "true",
              "inherited_cagents_names": present,
              "policy": "Presence only; no values inspected, removed or replaced."
          }, indent=2) + "\n")
          if os.environ.get("GITHUB_ACTIONS") != "true" or present:
              print("Natural hosted User context required; present names: " + ", ".join(present), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Check out the exact research control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: research
          persist-credentials: false

      - name: Check out the pinned main setup
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c727f886628897c1749290213e9d65037253095a
          path: setup-main
          persist-credentials: false

      - name: Check out corrected PR 1354
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 7c0022e23ea8548dea4df050f68d76fba94bca53
          path: product-1354
          persist-credentials: false

      - name: Check out corrected PR 1564
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d5856815491720bf13acb3897fb911bfc00f535f
          path: product-1564
          persist-credentials: false

      - name: Check out corrected PR 1294
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 7b26db7f3a75e3845302d6623a7d51f70f45aa1c
          path: product-1294
          persist-credentials: false

      - name: Check out corrected PR 1228
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 22c0d9350fc658b58f44700298577494312b9c10
          path: product-1228
          persist-credentials: false

      - name: Check out the exact PR 1931 capacity component
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 6a287ca24f2c701fc4daea6265cf9cb98d559c71
          path: product-1931
          persist-credentials: false

      - name: Verify every literal source and setup before compilation
        env:
          EXPECTED_CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["MOD1_EVIDENCE_ROOT"])
          manifest_path = workspace / "research/research/mod1-corrections/manifest.json"
          manifest = json.loads(manifest_path.read_text())
          shutil.copyfile(manifest_path, evidence / "manifest.json")
          def git(root, *args):
              return subprocess.check_output(["git", "--no-optional-locks", "-C", str(root), *args], text=True).strip()
          def source(root, head, tree):
              result = {"head": git(root, "rev-parse", "HEAD"), "tree": git(root, "rev-parse", "HEAD^{tree}"),
                        "status": git(root, "status", "--porcelain=v1", "--untracked-files=all")}
              assert result == {"head": head, "tree": tree, "status": ""}, result
              assert not any(line.startswith("160000 ") for line in git(root, "ls-files", "--stage").splitlines()), "unexpected submodule"
              return result
          control = workspace / "research"
          assert git(control, "rev-parse", "HEAD") == os.environ["EXPECTED_CONTROL_SHA"]
          assert git(control, "status", "--porcelain=v1", "--untracked-files=all") == ""
          records = {"control_head": git(control, "rev-parse", "HEAD"),
                     "control_tree": git(control, "rev-parse", "HEAD^{tree}"),
                     "workflow_sha256": hashlib.sha256((control / ".github/workflows/qualify-mod1-corrections.yml").read_bytes()).hexdigest(),
                     "setup": source(workspace / "setup-main", manifest["setup_head"], manifest["setup_tree"]),
                     "products": {}}
          action = workspace / "setup-main/.github/actions/setup-linux-build/action.yml"
          assert hashlib.sha256(action.read_bytes()).hexdigest() == manifest["setup_sha256"]
          assert manifest["never_merge"] is True
          assert [p["pr"] for p in manifest["products"]] == [1354, 1564, 1294, 1228, 1931]
          assert sum(len(p["selectors"]) for p in manifest["products"][:4]) == 8
          assert sum(len(set(p["selectors"] + [name for suite in p.get("suites", []) for name in suite["selectors"]])) for p in manifest["products"]) == 35
          capacity = manifest["products"][-1]
          assert len(capacity["selectors"]) == 2 and len(capacity["suites"]) == 1
          assert len(capacity["suites"][0]["selectors"]) == 25
          for product in manifest["products"]:
              names = product["selectors"] + [name for suite in product.get("suites", []) for name in suite["selectors"]]
              assert len(names) == len(set(names)), "no parent may run twice"
              assert set(product.get("owning_selectors", product["selectors"])).issubset(names)
          for product in manifest["products"]:
              root = workspace / ("product-" + str(product["pr"]))
              record = source(root, product["head"], product["tree"])
              paths = ["Cargo.toml", "Cargo.lock", "src/lib.rs", "src/modules.rs", *product["source_paths"]]
              record["source_sha256"] = {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in paths}
              records["products"][str(product["pr"])] = record
          (evidence / "sources-before.json").write_text(json.dumps(records, indent=2) + "\n")
          PY

      - name: Install the pinned main Linux Rust and Zig setup
        uses: ./setup-main/.github/actions/setup-linux-build

      - name: Retain the pinned build tools
        run: |
          set -euo pipefail
          {
            rustc -vV
            cargo --version
            zig version
            clang --version
            git --version
            timeout --version
          } > "$MOD1_EVIDENCE_ROOT/tools.txt"

      - name: Sequentially check and run only the exact owning parents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, subprocess, tempfile, time
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["MOD1_EVIDENCE_ROOT"])
          manifest = json.loads((evidence / "manifest.json").read_text())
          results = []
          products = []
          class ProductFailure(RuntimeError):
              def __init__(self, label, message):
                  self.label = label
                  super().__init__(message)
          def put(path, value):
              path.write_text(json.dumps(value, indent=2) + "\n")
          def digest(path):
              value = hashlib.sha256()
              with pathlib.Path(path).open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          def result(global_error=None):
              for product in products:
                  source = next(item for item in manifest["products"] if item["pr"] == product["pr"])
                  product["observed_owning_selectors"] = [name for name in source.get("owning_selectors", source["selectors"]) if name in product["qualified_parents"]]
              if global_error is not None:
                  for product in products:
                      if product["status"] == "running":
                          product.update(status="stopped_globally", unrun_selector_invocations=None, unrun_suite_invocations=None)
              passed = len(products) == len(manifest["products"]) and all(product["status"] == "passed" for product in products)
              value = {"narrow_qualification": "passed" if passed and global_error is None else "failed",
                       "stopped_globally": global_error is not None, "error": global_error,
                       "completed_phases": len(results), "products": products,
                       "unattempted_products": [product["pr"] for product in manifest["products"] if product["pr"] not in {item["pr"] for item in products}],
                       "qualified_parent_count": sum(len(product["qualified_parents"]) for product in products),
                       "requested_parent_count": sum(len(set(product["selectors"] + [name for suite in product.get("suites", []) for name in suite["selectors"]])) for product in manifest["products"]),
                       "limits": manifest["limits"]}
              put(evidence / "result.json", value)
              return value
          def git(root, *args):
              return subprocess.check_output(["git", "--no-optional-locks", "-C", str(root), *args], text=True).strip()
          def verify(root, product):
              assert git(root, "rev-parse", "HEAD") == product["head"]
              assert git(root, "rev-parse", "HEAD^{tree}") == product["tree"]
              assert git(root, "status", "--porcelain=v1", "--untracked-files=all") == ""
          def verify_helper(helper, env):
              assert env["CAGENTS_TEST_RETAINED_ACTOR_HELPER"] == helper["path"]
              assert digest(helper["path"]) == helper["sha256"], "matched helper changed"
          def phase(product, label, command, env, selector=None, expected_names=None, inventory_names=None, helper=None):
              root = workspace / ("product-" + str(product["pr"]))
              verify(root, product)
              if helper is not None:
                  verify_helper(helper, env)
              output = evidence / (str(product["pr"]) + "-" + label)
              output.mkdir()
              bounded = ["timeout", "--signal=TERM", "--kill-after=30s", "2700s", *command]
              record = {"source": product, "label": label, "selector": selector, "cwd": str(root), "command": command,
                        "expected_names": expected_names, "inventory_names": inventory_names, "matched_helper": helper,
                        "bounded_command": bounded, "command_bound_seconds": 2700,
                        "started_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        "status": "running", "fixture_root": env["TMPDIR"],
                        "target_dir": env["CARGO_TARGET_DIR"],
                        "completion_scope": "GNU timeout wrapper/direct wait only; no detached-family closure claim."}
              put(output / "command.json", record)
              print("START", product["pr"], label, flush=True)
              start = time.monotonic()
              with (output / "stdout.log").open("wb") as stdout, (output / "stderr.log").open("wb") as stderr:
                  completed = subprocess.run(bounded, cwd=root, env=env, stdout=stdout, stderr=stderr)
              status = completed.returncode
              record.update(status="returned", wrapper_exit=status, direct_wait_complete=True,
                            wall_seconds=time.monotonic() - start)
              record["command_exit"] = status if 0 <= status < 124 else None
              record["timeout_or_wrapper_failure"] = status >= 124 or status < 0
              record["stdout_sha256"] = hashlib.sha256((output / "stdout.log").read_bytes()).hexdigest()
              record["stderr_sha256"] = hashlib.sha256((output / "stderr.log").read_bytes()).hexdigest()
              put(output / "command.json", record)
              (output / "exit.txt").write_text(str(status) + "\n")
              results.append(record)
              put(evidence / "phases.json", results)
              print("RETURN", product["pr"], label, "exit", status, flush=True)
              verify(root, product)
              if helper is not None:
                  verify_helper(helper, env)
              if record["timeout_or_wrapper_failure"]:
                  raise RuntimeError(f"PR {product['pr']} {label}: uncertain timeout/signal/wrapper outcome; stop globally")
              if status != 0:
                  raise ProductFailure(label, f"PR {product['pr']} {label} failed with exit {status}; preserve original logs, no retry")
              if inventory_names is not None:
                  text = (output / "stdout.log").read_text() + "\n" + (output / "stderr.log").read_text()
                  names = re.findall(r"^(\S+): test$", text, re.M)
                  if not inventory_names or sorted(names) != sorted(inventory_names):
                      raise ProductFailure(label, f"Compiled test inventory differs: expected={inventory_names}, actual={names}")
                  put(output / "inventory.json", {"names": names, "count": len(names), "execution": "list only; no parent pass claimed"})
              if selector or expected_names is not None:
                  text = (output / "stdout.log").read_text() + "\n" + (output / "stderr.log").read_text()
                  names = re.findall(r"^test (\S+) \.\.\. ok$", text, re.M)
                  summaries = re.findall(r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;", text, re.M)
                  expected = [selector] if selector else expected_names
                  if not expected or sorted(names) != sorted(expected) or summaries != [("ok", str(len(expected)), "0", "0")]:
                      raise ProductFailure(label, f"Parent oracle failed: expected={expected}, names={names}, summaries={summaries}")
                  put(output / ("exact-parent.json" if selector else "suite-parents.json"),
                      {"names": names, "passed": len(names), "failed": 0, "ignored": 0})
              return output
          try:
              assert not any(name.startswith("CAGENTS_") for name in os.environ)
              for product in manifest["products"]:
                  assert product["feature"] in ("ui", "host")
                  assert product["binary"] == ("cagents-ui" if product["feature"] == "ui" else "cagentsd")
                  fixture = pathlib.Path(tempfile.mkdtemp(prefix="m1", dir="/tmp"))
                  fixture.chmod(0o700)
                  env = os.environ.copy()
                  env["TMPDIR"] = str(fixture)
                  for key, leaf in [("XDG_RUNTIME_DIR", "run"), ("XDG_DATA_HOME", "data"),
                                    ("XDG_CONFIG_HOME", "config"), ("XDG_CACHE_HOME", "cache"),
                                    ("XDG_STATE_HOME", "state")]:
                      directory = fixture / leaf
                      directory.mkdir(mode=0o700)
                      env[key] = str(directory)
                  env["CARGO_TARGET_DIR"] = str(pathlib.Path(os.environ["RUNNER_TEMP"]) / ("mod1-target-" + product["feature"]))
                  env["CARGO_BUILD_JOBS"] = "2"
                  outcome = {"pr": product["pr"], "head": product["head"], "status": "running",
                             "check": "unrun", "qualified_parents": [],
                             "unrun_selector_invocations": list(product["selectors"]),
                             "unrun_suite_invocations": [suite["prefix"] for suite in product.get("suites", [])]}
                  products.append(outcome)
                  result()
                  try:
                      outcome["check"] = "running"
                      phase(product, "check", ["cargo", "check", "--locked", "--no-default-features",
                            "--features", product["feature"], "--bin", product["binary"]], env)
                      outcome["check"] = "passed"
                      helper = None
                      if product.get("matched_helper"):
                          assert product["pr"] == 1931 and product["feature"] == "host"
                          built = phase(product, "helper-build", ["python3", "scripts/build-ceditor-product", "cagentsd",
                              "--locked", "--no-default-features", "--features", "host", "--bin", "cagentsd"], env)
                          paths = (built / "stdout.log").read_text().splitlines()
                          assert len(paths) == 1 and pathlib.Path(paths[0]).is_absolute(), "one Cargo-reported helper path required"
                          executable = pathlib.Path(paths[0]).resolve(strict=True)
                          assert executable.is_file() and os.access(executable, os.X_OK)
                          assert executable.is_relative_to(pathlib.Path(env["CARGO_TARGET_DIR"]).resolve(strict=True))
                          root = workspace / ("product-" + str(product["pr"]))
                          build = json.loads((built / "command.json").read_text())
                          assert build["command_exit"] == build["wrapper_exit"] == 0
                          helper = {"path": str(executable), "sha256": digest(executable),
                                    "source_head": product["head"], "source_tree": product["tree"],
                                    "build_phase": str(built), "build_command_exit": build["command_exit"],
                                    "target_dir": env["CARGO_TARGET_DIR"],
                                    "source_sha256": {name: digest(root / name) for name in ["Cargo.toml", "Cargo.lock", ".cargo/config.toml", "scripts/build-ceditor-product"]},
                                    "scope": "Cargo-reported path and digest observed after this same-source build, rechecked around tests; no execution-held image claim."}
                          put(evidence / "1931-matched-helper.json", helper)
                          env = env.copy()
                          env["CAGENTS_TEST_RETAINED_ACTOR_HELPER"] = helper["path"]
                      for index, suite in enumerate(product.get("suites", []), 1):
                          base = ["cargo", "test", "--locked", "--no-default-features", "--features", product["feature"], "--lib", suite["prefix"]]
                          phase(product, f"list-{index}", base + ["--", "--list", "--color=never"], env,
                                inventory_names=suite["selectors"], helper=helper)
                          outcome["unrun_suite_invocations"].remove(suite["prefix"])
                          observed = phase(product, f"suite-{index}", base + ["--", "--nocapture", "--test-threads=1", "--color=never"], env,
                                           expected_names=suite["selectors"], helper=helper)
                          outcome["qualified_parents"].extend(json.loads((observed / "suite-parents.json").read_text())["names"])
                      for index, selector in enumerate(product["selectors"], 1):
                          outcome["unrun_selector_invocations"].remove(selector)
                          observed = phase(product, f"parent-{index}", ["cargo", "test", "--locked", "--no-default-features",
                                           "--features", product["feature"], "--lib", selector, "--",
                                           "--exact", "--nocapture", "--test-threads=1", "--color=never"], env, selector, helper=helper)
                          outcome["qualified_parents"].extend(json.loads((observed / "exact-parent.json").read_text())["names"])
                      assert set(product.get("owning_selectors", product["selectors"])).issubset(outcome["qualified_parents"])
                      outcome["status"] = "passed"
                  except ProductFailure as error:
                      outcome.update(status="failed", failed_phase=error.label, error=str(error))
                      if error.label == "check":
                          outcome["check"] = "failed"
                      print("PRODUCT FAILED", product["pr"], str(error), flush=True)
                  result()
          except BaseException as error:
              result(global_error=str(error))
              raise
          if result()["narrow_qualification"] != "passed":
              raise SystemExit(1)
          PY

      - name: Retain final source state even after a failed phase
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mod1-corrections-evidence"
          evidence.mkdir(mode=0o700, exist_ok=True)
          expected = evidence / "manifest.json"
          if not expected.exists():
              (evidence / "sources-after.json").write_text(json.dumps({"audit": "unavailable before source preflight"}) + "\n")
              raise SystemExit(0)
          manifest = json.loads(expected.read_text())
          records, failures = {}, []
          for product in manifest["products"]:
              root = workspace / ("product-" + str(product["pr"]))
              record = {}
              for label, args in [("head", ["rev-parse", "HEAD"]), ("tree", ["rev-parse", "HEAD^{tree}"]),
                                  ("status", ["status", "--porcelain=v1", "--untracked-files=all"])]:
                  result = subprocess.run(["git", "--no-optional-locks", "-C", str(root), *args], capture_output=True, text=True)
                  record[label] = {"exit": result.returncode, "stdout": result.stdout.strip(), "stderr": result.stderr}
              records[str(product["pr"])] = record
              if any(item["exit"] != 0 for item in record.values()) or record["head"]["stdout"] != product["head"] or record["tree"]["stdout"] != product["tree"] or record["status"]["stdout"]:
                  failures.append(product["pr"])
          (evidence / "sources-after.json").write_text(json.dumps({"products": records, "failures": failures}, indent=2) + "\n")
          assert not failures, failures
          PY

      - name: Retain original raw qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mod1-corrections-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mod1-corrections-evidence/
          if-no-files-found: error
          retention-days: 14
