name: Isolated Rust

on:
  pull_request:
    # Keep Rust-consumed assets, scripts and tests/fixtures (including Python)
    # in scope. Only standalone documentation and Python harnesses are omitted.
    paths-ignore:
      - docs/**
      - website/**
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - tests/*.py
      - tests/qualification/**
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - website/**
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - tests/*.py
      - tests/qualification/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  RUSTUP_TOOLCHAIN: 1.93.0
  RUSTUP_AUTO_INSTALL: "0"
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Rust ${{ matrix.lane }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [CLI, HOST, UI]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify the source revision
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD 'HEAD^{tree}'

      - name: Set up the pinned Linux build environment
        uses: ./.github/actions/setup-linux-build

      - name: Prepare short private fixture paths
        run: |
          fixture_root=$(mktemp -d /tmp/caXXXXXX)
          printf 'Private fixture root (retained until runner cleanup): %s\n' "$fixture_root"
          FIXTURE_ROOT="$fixture_root" python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["FIXTURE_ROOT"])
          if root.resolve() != root or len(os.fsencode(root)) > 28:
              raise SystemExit("fixture root must be a short physical absolute path")
          for ancestor in (root, *root.parents):
              if os.path.lexists(ancestor / ".git"):
                  raise SystemExit(f"fixture root has an enclosing Git locator: {ancestor}")
          runtime = root / "runtime"
          runtime.mkdir(mode=0o700)
          with Path(os.environ["GITHUB_ENV"]).open("a") as environment:
              environment.write(f"TMPDIR={root}\nXDG_RUNTIME_DIR={runtime}\n")
          PY
          ulimit -n

      - name: Check the isolated CLI
        if: matrix.lane == 'CLI'
        run: cargo check --locked --no-default-features --bin cagents

      - name: Test the complete isolated CLI
        if: matrix.lane == 'CLI'
        run: cargo test --locked --no-default-features --all-targets -- --test-threads=2

      - name: Check the isolated host
        if: matrix.lane == 'HOST'
        run: cargo check --locked --no-default-features --features host --bin cagentsd

      - name: Build the matched helper and test the complete isolated host
        if: matrix.lane == 'HOST'
        run: |
          retained_actor_helper=$(python3 scripts/build-ceditor-product cagentsd \
            --locked --no-default-features --features host --bin cagentsd)
          # Run the complete suite serially, including the retained 100-chat
          # workload. Never skip it or hide its result in a non-gating job.
          CAGENTS_TEST_RETAINED_ACTOR_HELPER="$retained_actor_helper" \
            cargo test --locked --no-default-features --features host --all-targets -- --test-threads=1

      - name: Check the isolated browserless UI
        if: matrix.lane == 'UI'
        run: cargo check --locked --no-default-features --features ui --bin cagents-ui

      - name: Test the complete isolated browserless UI
        if: matrix.lane == 'UI'
        run: cargo test --locked --no-default-features --features ui --all-targets -- --test-threads=2

      - name: Verify the source remains unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
