name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the Linux build environment
        uses: ./.github/actions/setup-linux-build
        with:
          packaging: "true"

      - name: Require the tag to match Cargo.toml
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cagents") | .version')"
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            echo "Could not determine one cagents package version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v${version})" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Test all targets in the release profile
        run: |
          set -euo pipefail
          zig version
          cargo test --locked --release --all-targets

      - name: Build Linux packages
        run: ./scripts/package-linux.sh

      - name: Stamp the installer and regenerate checksums
        run: |
          set -euo pipefail
          sed -i \
            "s|^DEFAULT_REPOSITORY='<OWNER>/<REPO>'$|DEFAULT_REPOSITORY='${GITHUB_REPOSITORY}'|" \
            dist/install.sh
          grep -Fqx "DEFAULT_REPOSITORY='${GITHUB_REPOSITORY}'" dist/install.sh
          (
            cd dist
            rm -f SHA256SUMS
            sha256sum \
              "cagents-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              "cagents_${VERSION}_amd64.deb" \
              install.sh > SHA256SUMS
          )

      - name: Validate packaged desktop metadata
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          tar -xzf "dist/cagents-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C "$staging"
          root="$staging/cagents-${VERSION}"
          desktop-file-validate \
            "$root/share/applications/dev.cagents.Cagents.desktop"
          appstreamcli validate --no-net --override=url-homepage-missing=info \
            "$root/share/metainfo/dev.cagents.Cagents.metainfo.xml"
          dpkg-deb --info "dist/cagents_${VERSION}_amd64.deb" >/dev/null

      - name: Stage and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_marker='<!-- cagents-release-workflow -->'
          assets=(
            "dist/cagents-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/cagents_${VERSION}_amd64.deb"
            dist/SHA256SUMS
            dist/install.sh
          )

          if release_state="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,body \
              --jq "[.isDraft, (.body | contains(\"${release_marker}\"))] | @tsv" \
              2>/dev/null
          )"; then
            read -r is_draft workflow_owned <<<"$release_state"
            if [[ "$is_draft" != true || "$workflow_owned" != true ]]; then
              echo "Refusing to modify a release that is not a workflow-owned draft" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "cagents ${GITHUB_REF_NAME}" \
              --notes "$release_marker" \
              --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          expected_assets="$(
            printf '%s\n' "${assets[@]##*/}" | LC_ALL=C sort
          )"
          actual_assets="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' |
              LC_ALL=C sort
          )"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Refusing to publish: release assets do not match the expected set" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi

          if [[ "$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft'
          )" != true ]]; then
            echo "Refusing to publish: release is no longer a draft" >&2
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
