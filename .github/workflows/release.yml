name: Release

# A pushed release tag on a main commit is built and signed here, once the
# release before it trusts the Actions signing key; until then (the 0.2.4
# release), and for any change of trusted keys, admission says so and a
# release is signed locally. The signed release is left as a verified draft,
# published only once its update is rehearsed:
#   scripts/release rehearse VERSION --from-draft
#   scripts/release publish VERSION --actions
# Run by hand on main, it builds and smoke-tests that exact commit for later use.
# See docs/releasing.md#signing-in-github-actions.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

# A tag runs once at a time. Releases are not serialized with one another: a
# shared group would cancel a waiting run when a third arrives. Publication
# refuses a release when a newer one is out.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    outputs:
      version: ${{ steps.admit.outputs.version }}
      commit: ${{ steps.admit.outputs.commit }}
      sign: ${{ steps.admit.outputs.sign }}
    steps:
      - name: Check out the tagged commit with its history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the tag annotated, as it is on origin
        # actions/checkout makes a tag lightweight (actions/checkout#290);
        # publication compares the tag object with origin's.
        if: github.ref_type == 'tag'
        run: git fetch --no-tags --force origin "+$GITHUB_REF:$GITHUB_REF"
      - name: Decide whether Actions signs it
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          RELEASE_TRUSTED_KEYS: ${{ vars.RELEASE_TRUSTED_KEYS }}
        run: scripts/release-actions admit "$GITHUB_REF_NAME"
      - name: Require the tagged commit's passing fw16 tests
        if: steps.admit.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.admit.outputs.commit }}
        run: scripts/release-actions require-tests "$COMMIT"

  build:
    name: Qualify the Linux bundle
    needs: admit
    # A rehearsal, run by hand, has no admission and is never signed.
    if: >-
      !cancelled() && ((needs.admit.result == 'success' && needs.admit.outputs.sign == 'true')
      || (github.event_name == 'workflow_dispatch' && needs.admit.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the tagged commit with its history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the tag annotated, as it is on origin
        # actions/checkout makes a tag lightweight (actions/checkout#290);
        # publication compares the tag object with origin's.
        if: github.ref_type == 'tag'
        run: git fetch --no-tags --force origin "+$GITHUB_REF:$GITHUB_REF"
      - name: Find the tagged commit's prepared bundle
        id: prepared
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.admit.outputs.commit }}
        run: scripts/release-actions prepared-bundle "$COMMIT"
      - name: Take the prepared artifact by ID
        if: steps.prepared.outputs.artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.prepared.outputs.run_id }}
          artifact-ids: ${{ steps.prepared.outputs.artifact_id }}
          path: ${{ runner.temp }}/prepared-dist
      - name: Verify the prepared files and refresh their release notes
        if: steps.prepared.outputs.artifact_id != ''
        env:
          VERSION: ${{ needs.admit.outputs.version }}
          COMMIT: ${{ needs.admit.outputs.commit }}
        run: |
          dist="$RUNNER_TEMP/prepared-dist"
          scripts/release-metadata check --dir "$dist" --version "$VERSION" --source-commit "$COMMIT"
          protocol=$(jq -er .protocol "$dist/release-metadata.json")
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$COMMIT^" 2>/dev/null) || previous=
          scripts/release-metadata notes --repository "$GITHUB_WORKSPACE" ${previous:+--from "$previous"} \
            --to "$COMMIT" > "$RUNNER_TEMP/release-notes.md"
          rm -- "$dist/release-metadata.json"
          scripts/release-metadata write --dir "$dist" --version "$VERSION" --source-commit "$COMMIT" \
            --protocol "$protocol" --notes "$RUNNER_TEMP/release-notes.md"
      - name: Prepare the runner for rootless release builds
        if: steps.prepared.outputs.artifact_id == ''
        run: .github/release-runner-setup
      - name: Build, package and smoke-test the release source
        if: steps.prepared.outputs.artifact_id == ''
        env:
          CAGENTS_RELEASE_CACHE: /mnt/cagents/release-cache
          CAGENTS_RELEASE_SMOKE_CACHE: /mnt/cagents/smoke-cache
          TMPDIR: /mnt/cagents/tmp
          REF: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
        run: scripts/build-release-linux --ref "$REF" --output /mnt/cagents/dist
      - name: Keep the bundle for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && format('qualified-linux-{0}', github.run_attempt) || 'bundle' }}
          path: ${{ steps.prepared.outputs.artifact_id != '' && format('{0}/prepared-dist', runner.temp) || '/mnt/cagents/dist/' }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 7 || 1 }}

  sign:
    name: Sign the metadata
    needs: [admit, build]
    if: >-
      github.event_name == 'push' && needs.admit.result == 'success'
      && needs.admit.outputs.sign == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can read the signing key, and only for a tag that the
    # environment's deployment policy allows.
    environment: release
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Take this run's bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: ${{ runner.temp }}/dist
      - name: Check the bundle and sign its metadata
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          VERSION: ${{ needs.admit.outputs.version }}
          COMMIT: ${{ needs.admit.outputs.commit }}
        run: scripts/release-actions sign "$RUNNER_TEMP/dist" "$VERSION" "$COMMIT"
      - name: Keep the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: ${{ runner.temp }}/dist/release-metadata.json.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Leave the release as a draft
    needs: [admit, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit with its history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep the tag annotated, as it is on origin
        # actions/checkout makes a tag lightweight (actions/checkout#290);
        # publication compares the tag object with origin's.
        if: github.ref_type == 'tag'
        run: git fetch --no-tags --force origin "+$GITHUB_REF:$GITHUB_REF"
      - name: Prepare the runner for the offline smoke install
        run: .github/release-runner-setup
      - name: Take this run's bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: /mnt/cagents/dist
      - name: Take its signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: /mnt/cagents/dist
      - name: Verify everything again, then upload it as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          CAGENTS_RELEASE_SMOKE_CACHE: /mnt/cagents/smoke-cache
          TMPDIR: /mnt/cagents/tmp
          VERSION: ${{ needs.admit.outputs.version }}
        run: |
          scripts/prepare-release-smoke-rootfs >/dev/null
          scripts/publish-release --version "$VERSION" --dist /mnt/cagents/dist --draft
