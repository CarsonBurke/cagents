      - name: Compile the UI library libtest once and bind its exact artifact
        timeout-minutes: 45
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 091f030dadb17bec2008786acdb7decaadd90e7c
          test "$(git rev-parse 'HEAD^{tree}')" = 197e4abaeee303c694cc2f04bfc50545cbba95eb
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import os
          assert not [n for n in os.environ if n.startswith('CAGENTS')
                      or n in {'AUTH', 'AGENT_TOKEN', 'SESSION_TOKEN'}]
          PY
          set +e
          timeout --signal=TERM --kill-after=15s 2400s \
            cargo test --locked --no-default-features --features ui --lib --no-run \
              --message-format=json \
              > "$P0_EVIDENCE_DIR/test-build.jsonl" 2> "$P0_EVIDENCE_DIR/test-build.stderr"
          result=$?
          set -e
          printf '%s\n' "$result" > "$P0_EVIDENCE_DIR/test-build.exit"
          test "$result" -eq 0
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['P0_EVIDENCE_DIR'])
          control = json.loads((evidence / 'control-source.json').read_text())
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == control['product_head']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == control['product_tree']
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          rows = [json.loads(line) for line in (evidence / 'test-build.jsonl').read_text().splitlines()]
          check_rows = [json.loads(line) for line in (evidence / 'ui-check.jsonl').read_text().splitlines()]
          assert all('ghostty' not in row.get('package_id', '').lower()
                     for row in rows + check_rows), 'Unexpected Ghostty graph in UI-only route'
          artifacts = [row for row in rows if row.get('reason') == 'compiler-artifact'
                       and row['target']['name'] == 'cagents' and 'lib' in row['target']['kind']
                       and row.get('executable') and row['profile']['test']]
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert pathlib.Path(artifact['manifest_path']).resolve() == pathlib.Path('Cargo.toml').resolve()
          assert 'ui' in artifact['features'] and 'host' not in artifact['features']
          assert 'integrated-browser' not in artifact['features']
          executable = pathlib.Path(artifact['executable']).resolve(strict=True)
          assert executable.is_file() and os.access(executable, os.X_OK)
          checksum = hashlib.sha256()
          with executable.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  checksum.update(block)
          info = executable.stat()
          (evidence / 'test-artifact.json').write_text(json.dumps({
              'path': str(executable), 'sha256': checksum.hexdigest(),
              'device': info.st_dev, 'inode': info.st_ino, 'size': info.st_size,
              'source_head': control['product_head'], 'source_tree': control['product_tree'],
              'control_head': control['control_head'], 'compiler_artifact': artifact,
          }, indent=2) + '\n')
          PY

      - name: Prepare short private fixture paths after natural User preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tempfile
          assert not [n for n in os.environ if n.startswith('CAGENTS')
                      or n in {'AUTH', 'AGENT_TOKEN', 'SESSION_TOKEN'}]
          root = pathlib.Path(tempfile.mkdtemp(prefix='u49', dir='/tmp'))
          for leaf in ['home', 'data', 'config', 'state', 'cache', 'tmp', 'run']:
              (root / leaf).mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, leaf in [('HOME', 'home'), ('XDG_DATA_HOME', 'data'),
                                 ('XDG_CONFIG_HOME', 'config'), ('XDG_STATE_HOME', 'state'),
                                 ('XDG_CACHE_HOME', 'cache'), ('TMPDIR', 'tmp'),
                                 ('XDG_RUNTIME_DIR', 'run')]:
                  output.write(f'{name}={root / leaf}\n')
              output.write(f'P0_UI_FIXTURE_ROOT={root}\n')
          paths = {str(p): {'mode': oct(p.stat().st_mode & 0o777),
                           'uid': p.stat().st_uid, 'device': p.stat().st_dev,
                           'inode': p.stat().st_ino} for p in [root, *sorted(root.iterdir())]}
          evidence = pathlib.Path(os.environ['P0_EVIDENCE_DIR'])
          (evidence / 'private-paths.json').write_text(json.dumps(paths, indent=2) + '\n')
          PY

      - name: Run all36 exact parents serially and stop at the first failure
        timeout-minutes: 90
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, time
          evidence = pathlib.Path(os.environ['P0_EVIDENCE_DIR'])
          control = json.loads((evidence / 'control-source.json').read_text())
          identity = json.loads((evidence / 'test-artifact.json').read_text())
          selectors = json.loads((evidence / 'selectors.json').read_text())
          assert len(selectors) == 36 and len(set(selectors)) == 36
          executable = pathlib.Path(identity['path'])
          fixture_root = pathlib.Path(os.environ['P0_UI_FIXTURE_ROOT']).resolve(strict=True)
          results = []
          def digest(path):
              checksum = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      checksum.update(block)
              return checksum.hexdigest()
          def source():
              def git(*args):
                  return subprocess.check_output(['git', *args], text=True).strip()
              return {'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                      'status': git('status', '--porcelain'),
                      'source_sha256': {p: digest(pathlib.Path(p)) for p in control['source_sha256']}}
          def exact(value):
              return (value['head'] == control['product_head'] and value['tree'] == control['product_tree']
                      and not value['status'] and value['source_sha256'] == control['source_sha256'])
          def context_names():
              return sorted(n for n in os.environ if n.startswith('CAGENTS')
                            or n in {'AUTH', 'AGENT_TOKEN', 'SESSION_TOKEN'})
          def census():
              # Authored isolation uses current_exe child modes; expected
              # scripted peers use threads. Nominate by readable comm/argv
              # before protected exe/cwd observations. This bounded diagnostic
              # is not whole-host/family/custody proof or signal authority.
              found, candidate_errors, diagnostics = [], [], []
              noncandidates, other_uids = 0, 0
              for entry in pathlib.Path('/proc').iterdir():
                  if not entry.name.isdigit():
                      continue
                  reasons, comm, started = [], None, None
                  stage = 'uid'
                  try:
                      if entry.stat().st_uid != os.getuid():
                          other_uids += 1
                          continue
                      stage = 'stat_before_nomination'
                      before = (entry / 'stat').read_text()
                      comm = before[before.index('(') + 1:before.rindex(')')]
                      tail = before[before.rindex(')') + 2:].split()
                      started = int(tail[19])
                      if comm == executable.name[:15]:
                          reasons.append('matching_test_comm_candidate')
                      stage = 'cmdline_nomination'
                      args = (entry / 'cmdline').read_bytes().split(b'\0')
                      if any(arg == str(executable).encode() for arg in args):
                          reasons.append('exact_test_executable_argument')
                      prefix = str(fixture_root).encode() + b'/'
                      if any(arg == str(fixture_root).encode() or arg.startswith(prefix) for arg in args):
                          reasons.append('private_fixture_path_argument')
                      stage = 'stat_after_nomination'
                      nominated = (entry / 'stat').read_text()
                      if int(nominated[nominated.rindex(')') + 2:].split()[19]) != started:
                          raise ValueError('identity_changed_during_nomination')
                      if not reasons:
                          noncandidates += 1
                          continue
                      # Positively nominated uncertainty fails closed. Do not
                      # probe these protected details for unrelated processes.
                      stage = 'candidate_executable'
                      info = (entry / 'exe').stat()
                      if (info.st_dev, info.st_ino) == (identity['device'], identity['inode']):
                          reasons.append('exact_test_executable_file_identity')
                      stage = 'candidate_working_directory'
                      cwd = (entry / 'cwd').resolve(strict=True)
                      if cwd == fixture_root or fixture_root in cwd.parents:
                          reasons.append('private_fixture_working_directory')
                      stage = 'candidate_stat_after_details'
                      after = (entry / 'stat').read_text()
                      if int(after[after.rindex(')') + 2:].split()[19]) != started:
                          raise ValueError('candidate_identity_changed_during_observation')
                      found.append({'pid': int(entry.name), 'start_ticks': started,
                                    'comm': comm, 'state': tail[0], 'candidate_reasons': reasons})
                  except (OSError, ValueError, IndexError) as error:
                      detail = {'pid': int(entry.name), 'start_ticks': started,
                                'comm': comm, 'stage': stage, 'error': type(error).__name__,
                                'candidate_reasons': reasons}
                      (candidate_errors if reasons else diagnostics).append(detail)
              return {'candidates': found, 'candidate_observation_errors': candidate_errors,
                      'unclassified_observation_diagnostics': diagnostics,
                      'same_uid_readable_noncandidates': noncandidates,
                      'other_uid_processes_outside_scope': other_uids,
                      'whole_host_observation_complete': False,
                      'strict_family_or_custody_proof': False,
                      'scope': 'Bounded comm/argv-nominated artifact/private-path observations only; unreadable unclassified processes remain incomplete diagnostics. No whole-host/family-zero claim, PPID custody or signaling'}
          for index, selector in enumerate(selectors, 1):
              phase = evidence / f'parent-{index:02d}'
              phase.mkdir(mode=0o700)
              pre_source, pre_census, names = source(), census(), context_names()
              preflight = {'selector': selector, 'source': pre_source, 'census': pre_census,
                           'forbidden_context_names': names, 'test_sha256': digest(executable)}
              (phase / 'preflight.json').write_text(json.dumps(preflight, indent=2) + '\n')
              assert exact(pre_source) and not names
              assert not pre_census['candidates'] and not pre_census['candidate_observation_errors']
              assert preflight['test_sha256'] == identity['sha256']
              argv = ['timeout', '--signal=TERM', '--kill-after=15s', '150s',
                      str(executable), selector, '--exact', '--nocapture', '--test-threads=1']
              started = time.monotonic()
              with (phase / 'stdout').open('wb') as stdout, (phase / 'stderr').open('wb') as stderr:
                  result = subprocess.run(argv, stdout=stdout, stderr=stderr)
              output = (phase / 'stdout').read_text(errors='replace')
              post_source, post_census, post_names = source(), census(), context_names()
              hash_after = digest(executable)
              summary = re.findall(r'^test result: ok\. 1 passed; 0 failed; 0 ignored;.*$', output, re.M)
              selected = output.count(f'test {selector} ...')
              integrity = (exact(post_source) and not post_names
                           and not post_census['candidates'] and not post_census['candidate_observation_errors']
                           and hash_after == identity['sha256'])
              passed = (result.returncode == 0 and selected == 1 and len(summary) == 1
                        and len(re.findall(r'^running 1 test$', output, re.M)) == 1 and integrity)
              record = {'index': index, 'selector': selector, 'argv': argv,
                        'parent_exit': result.returncode, 'selected_exact_parent_count': selected,
                        'expected_exact_parent_count': 1, 'parent_summary': summary,
                        'passed': passed, 'integrity_qualified': integrity,
                        'elapsed_seconds': time.monotonic() - started, 'timeout_seconds': 150,
                        'source_before': pre_source, 'source_after': post_source,
                        'test_artifact': identity, 'test_sha256_after': hash_after,
                        'pre_census': pre_census, 'post_census': post_census,
                        'forbidden_context_names_after': post_names,
                        'stdout_sha256': digest(phase / 'stdout'), 'stderr_sha256': digest(phase / 'stderr'),
                        'nested_child_evidence': ('Fixture source asserts child exit success and stdout containing 1 passed for its exact-selector invocation; successful child pipes are privately consumed. Failure output is retained in parent stdout/stderr. No independent raw child exit/count receipt or added child count is claimed.' if selector in selectors[13:31] else 'Direct UI parent; no nested libtest execution or independent child receipt is claimed.'),
                        'cleanup': 'Only existing test-owned guards plus GNU timeout command-group bound; observational census never signals processes. Any timeout/assisted cleanup is a failure.',
                        'outer_timeout_status': result.returncode in (124, 137),
                        'scope': 'UI libtest parent only; no actual native app, HOST helper or live provider qualification'}
              (phase / 'result.json').write_text(json.dumps(record, indent=2) + '\n')
              results.append(record)
              (evidence / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              assert passed, f'Exact parent {index} failed; stop before another fixture'
          assert len(results) == 36 and all(row['passed'] for row in results)
          (evidence / 'qualification.json').write_text(json.dumps({
              'source_head': control['product_head'], 'source_tree': control['product_tree'],
              'exact_parents_passed': len(results), 'test_sha256': identity['sha256'],
              'scope': '36 serial UI parents (23 admission and 13 cold storage/frame contracts); not baseline causal controls, full CI, native UX or installed recovery',
          }, indent=2) + '\n')
          PY

      - name: Retain the temporary qualification evidence
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-final-user-scope-ui-${{ github.event.pull_request.head.sha }}
          path: ${{ env.P0_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
