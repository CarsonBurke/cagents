p_admission::retry_view::retained_retry_press_cannot_cross_attempts_and_unchanged_attempt_keeps_its_native_press', 'app::shared_views::tests::startup_admission::retry_view::disabled_retry_keeps_failure_visible_and_reenabled_retry_requires_a_fresh_press'], indent=2) + '\n')
