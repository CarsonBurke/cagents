name: Script contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: script-contracts-${{ github.ref }}
  # A newer push supersedes a pull request's run; every main commit keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.93.0
  RUSTUP_AUTO_INSTALL: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_NET_OFFLINE: "true"

# Every job checks out the event's own commit: for a pull request, its merge
# result, which is also where GitHub reads this workflow from. Suites and the
# sources they test therefore never come from different revisions.
jobs:
  plan:
    name: Contract structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse missing, symlinked or unlisted suites and bad shell syntax
        run: python3 -I -B scripts/script-contracts verify

      - name: Plan suite jobs
        id: plan
        run: printf 'matrix=%s\n' "$(python3 -I -B scripts/script-contracts plan)" >> "$GITHUB_OUTPUT"

  source:
    name: Formatting and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/script-contracts-setup

      - name: Check repository formatting
        run: scripts/check-format

      - name: Check selected IPC source contract
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Compare against what this commit changes: a merge result's base
          # parent, or the main commit this push replaced.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$PUSH_BEFORE
            case "$base" in
              *[!0-9a-f]* | "" | 0000000000000000000000000000000000000000)
                echo 'A trusted comparison base is required for the protocol contract' >&2; exit 2 ;;
            esac
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"
          fi
          sha256sum scripts/check-protocol-contract scripts/protocol_contract_source.py tests/protocol_contract.py
          python3 -I -B tests/protocol_contract.py -v
          python3 -I -B scripts/check-protocol-contract --base-ref "$base"

      - name: Check older clients are proven at the merged protocol
        run: |
          python3 -I -B tests/check_older_clients.py -v
          python3 -I -B scripts/check-older-clients

      - name: Verify the source remains unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

  suites:
    name: Suites (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/script-contracts-setup

      - name: Run ${{ matrix.label }}
        env:
          JOB: ${{ matrix.job }}
          SHARD: ${{ matrix.shard }}
        run: python3 -I -B scripts/script-contracts run "$JOB" "$SHARD"

      - name: Verify the source remains unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

  result:
    # One stable check that passes only when every job above passed, so a
    # skipped or cancelled job cannot read as success.
    name: Script contracts
    if: always()
    needs: [plan, source, suites]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every contract job
        env:
          PLAN: ${{ needs.plan.result }}
          SOURCE: ${{ needs.source.result }}
          SUITES: ${{ needs.suites.result }}
        run: |
          printf 'structure=%s source=%s suites=%s\n' "$PLAN" "$SOURCE" "$SUITES"
          test "$PLAN" = success && test "$SOURCE" = success && test "$SUITES" = success
