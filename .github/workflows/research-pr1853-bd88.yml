name: Research native portability and bounded backend followups
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - .github/workflows/research-pr1853-bd88.yml
permissions:
  contents: read
concurrency:
  group: research-pr1951-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.93.0
  EXPECTED_PRODUCT_SHA: ccb501ad4a65f726184d6e0d9aa5e7dc83d97825
  EXPECTED_PRODUCT_TREE: 4e436ed156df1f959014204fa58e663f359cf0bd
  EXPECTED_RECEIPT_SHA: 5ad7985a56aaac5760cb71a6ea3d1ed2ba2c956a
  EXPECTED_RECEIPT_TREE: 67cbc81261e9c0f2a6f1bdf8718b7fd12fd2e787
  EXPECTED_FIXTURE_SHA: 32bc36da066bcf0cb614cff704a94c442279d3b1
  EXPECTED_FIXTURE_TREE: 68620a875769fcd9a0505165460689bbded9fc80
jobs:
  macos:
    if: github.event.pull_request.head.ref == 'research/pr1853-bd88-qualification-20261028' && github.event.pull_request.head.repo.full_name ==
      github.repository
    name: Native Apple ARM CLI link run and seventeen owning roots
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
    - name: Require natural User context and private fixture paths
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, pathlib, sys, tempfile
        logs=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-apple-logs'
        logs.mkdir(mode=0o700)
        names=sorted(name for name in os.environ if name.startswith('CAGENTS_'))
        (logs/'natural-context.json').write_text(json.dumps({'present_names':names})+'\n')
        if names:
            raise SystemExit('Natural User qualification refused: '+', '.join(names))
        fixture=pathlib.Path(tempfile.mkdtemp(prefix='c1951',dir='/tmp'))
        with open(os.environ['GITHUB_ENV'],'a') as env:
            print('EVIDENCE_DIR='+str(logs),file=env)
            print('CARGO_TARGET_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-apple-target'),file=env)
            print('TMPDIR='+str(fixture),file=env)
            for name,leaf in [('XDG_RUNTIME_DIR','runtime'),('XDG_DATA_HOME','data'),('XDG_CONFIG_HOME','config'),('XDG_CACHE_HOME','cache'),('XDG_STATE_HOME','state')]:
                (fixture/leaf).mkdir(mode=0o700)
                print(name+'='+str(fixture/leaf),file=env)
        PY
    - name: Check out research
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: research
        persist-credentials: false
    - name: Check out product
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ccb501ad4a65f726184d6e0d9aa5e7dc83d97825
        path: product
        persist-credentials: false
    - name: Bind exact product and research sources
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os,pathlib,subprocess
        root=pathlib.Path.cwd()
        logs=pathlib.Path(os.environ['EVIDENCE_DIR'])
        def git(*args,where=root):
            return subprocess.check_output(['git',*args],cwd=where,text=True).strip()
        assert git('rev-parse','HEAD')==os.environ['EXPECTED_PRODUCT_SHA']
        assert git('rev-parse','HEAD^{tree}')==os.environ['EXPECTED_PRODUCT_TREE']
        assert not git('status','--porcelain','--untracked-files=all')
        research=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'research'
        assert git('rev-parse','HEAD',where=research)==os.environ['EXPECTED_RESEARCH_SHA']
        assert not git('status','--porcelain','--untracked-files=all',where=research)
        paths=['Cargo.toml', 'Cargo.lock', 'src/lib.rs', 'src/modules.rs', '.cargo/config.toml', 'scripts/build-ceditor-product', 'src/chat/attachment_assets.rs', 'src/control.rs', 'src/daemon.rs', 'src/daemon/holder_registry/connection.rs', 'src/fs_safety.rs', 'src/fs_safety/darwin.rs', 'src/fs_safety/directory_creation.rs', 'src/fs_safety/linux.rs', 'src/host/client.rs', 'src/install_guard.rs', 'src/instance.rs', 'src/instance/daemon_admission.rs', 'src/update.rs', 'src/update/source.rs', 'src/worktree_setup.rs', 'src/worktree_cleanup.rs']
        hashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in paths}
        hashes['research-workflow']=hashlib.sha256((research/'.github/workflows/research-pr1853-bd88.yml').read_bytes()).hexdigest()
        (logs/'source-before.json').write_text(json.dumps({'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'research_head':git('rev-parse','HEAD',where=research),'research_tree':git('rev-parse','HEAD^{tree}',where=research),'sha256':hashes},indent=2)+'\n')
        PY
    - name: Prepare and record native Apple toolchain
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64
        rustup toolchain install 1.93.0 --profile minimal
        { rustc -vV; cargo --version; sw_vers; uname -m; xcrun --show-sdk-path; cc --version; git --version; } > "$EVIDENCE_DIR/tools.txt"
        grep -Fx 'host: aarch64-apple-darwin' "$EVIDENCE_DIR/tools.txt"
    - name: Run literal apple qualification and retain every original exit
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, json, os, pathlib, re, subprocess, sys, time
        logs = pathlib.Path(os.environ['EVIDENCE_DIR'])
        records = []

        def phase(label, command):
            record = dict(label=label, command=command, started=time.time())
            records.append(record)
            (logs / 'phases.json').write_text(json.dumps(records, indent=2) + '\n')
            print('Starting ' + label, flush=True)
            path = logs / (label + '.txt')
            with path.open('wb') as output:
                result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT)
            record.update(exit=result.returncode, finished=time.time(), log_sha256=hashlib.sha256(path.read_bytes()).hexdigest())
            (logs / (label + '.exit')).write_text(str(result.returncode) + '\n')
            (logs / 'phases.json').write_text(json.dumps(records, indent=2) + '\n')
            print(path.read_text(errors='replace')[-14000:], flush=True)
            if result.returncode:
                raise SystemExit(result.returncode)
            return path.read_text(errors='replace')

        def exact(label, selector, feature=None):
            command = ['cargo', 'test', '--locked', '--no-default-features']
            if feature:
                command += ['--features', feature]
            command += ['--lib', selector, '--', '--exact', '--show-output', '--test-threads=1', '--color=never']
            output = phase(label, command)
            assert len(re.findall(r'^test ' + re.escape(selector) + r' \.\.\. ok$', output, re.M)) == 1, selector
            assert re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', output, re.M) == [('1', '0', '0')], selector
            return output

        phase('apple-cli-check', ['cargo','check','--locked','--no-default-features','--bin','cagents'])
        build = phase('apple-cli-build', ['cargo','build','--locked','--no-default-features','--bin','cagents','--message-format=json-render-diagnostics'])
        artifacts=[]
        for line in build.splitlines():
            try:
                item=json.loads(line)
            except ValueError:
                continue
            if item.get('reason')=='compiler-artifact' and item.get('target',{}).get('name')=='cagents' and item.get('executable'):
                assert item.get('features')==[], item
                artifacts.append(item)
        assert len(artifacts)==1, artifacts
        binary=pathlib.Path(artifacts[0]['executable']).resolve(strict=True)
        assert binary.is_relative_to(pathlib.Path(os.environ['CARGO_TARGET_DIR']).resolve(strict=True))
        binary_hash=hashlib.sha256(binary.read_bytes()).hexdigest()
        (logs/'linked-cli.json').write_text(json.dumps(dict(path=str(binary),sha256=binary_hash,artifact=artifacts[0]),indent=2)+'\n')
        output=phase('apple-cli-protocol-version', [str(binary),'--json','--device','unconfigured-portability-device','daemon','protocol-version'])
        reply=json.loads(output)
        assert reply['ok'] is True and reply['command']=='daemon.protocol_version' and reply['data']['protocol_version']==127, reply
        assert hashlib.sha256(binary.read_bytes()).hexdigest()==binary_hash
        phase('apple-lib-test-compile',['cargo','test','--locked','--no-default-features','--lib','--no-run'])
        for index, selector in enumerate(['update::tests::unsupported_streaming_never_starts_a_command_and_keeps_cancellation', 'install_guard::tests::unsupported_installation_refuses_before_path_or_window_preparation', 'instance::tests::unsupported_process_census_never_reports_an_empty_owned_inventory', 'update::source::platform_tests::unsupported_source_cannot_be_classified_as_an_absent_daemon', 'daemon::unsupported_platform_tests::ownership_refusal_precedes_runtime_discovery_and_socket_or_lease_access', 'daemon::unsupported_platform_tests::unsupported_descriptor_sealing_preserves_errno_without_executing_child', 'control::unsupported_connection_tests::unsupported_control_connection_precedes_path_validation_and_deadline_arithmetic', 'daemon::holder_registry::connection::unsupported_tests::unsupported_holder_connection_precedes_deadline_and_endpoint_work', 'fs_safety::tests::metadata_beneath_describes_a_symlink_as_itself', 'fs_safety::tests::a_symlinked_intermediate_component_is_rejected', 'fs_safety::tests::retained_directory_listing_and_permissions_ignore_replaced_names', 'fs_safety::tests::creation_modes_preserve_target_width_before_creating_entries', 'fs_safety::tests::unavailable_anonymous_publication_leaves_no_named_fallback', 'fs_safety::platform::tests::native_access_acl_copy_replaces_existing_acl_and_removes_observed_absence', 'fs_safety::tests::a_fifo_opens_without_blocking_and_is_identifiable', 'fs_safety::tests::exclusive_publication_preserves_existing_entries_and_dangling_links', 'worktree_cleanup::tests::root_operation_protection_uses_native_event_only_directory_pins'], 1):
            exact("apple-parent-%02d" % index, selector)
        print('Seventeen native owning CLI parents passed exactly once.', flush=True)
        PY
    - name: Always retain and require unchanged literal source
      if: always()
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os,pathlib,subprocess
        root=pathlib.Path.cwd()
        logs=pathlib.Path(os.environ['EVIDENCE_DIR'])
        def git(*args,where=root):
            return subprocess.check_output(['git',*args],cwd=where,text=True).strip()
        research=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'research'
        paths=['Cargo.toml', 'Cargo.lock', 'src/lib.rs', 'src/modules.rs', '.cargo/config.toml', 'scripts/build-ceditor-product', 'src/chat/attachment_assets.rs', 'src/control.rs', 'src/daemon.rs', 'src/daemon/holder_registry/connection.rs', 'src/fs_safety.rs', 'src/fs_safety/darwin.rs', 'src/fs_safety/directory_creation.rs', 'src/fs_safety/linux.rs', 'src/host/client.rs', 'src/install_guard.rs', 'src/instance.rs', 'src/instance/daemon_admission.rs', 'src/update.rs', 'src/update/source.rs', 'src/worktree_setup.rs', 'src/worktree_cleanup.rs']
        hashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in paths}
        hashes['research-workflow']=hashlib.sha256((research/'.github/workflows/research-pr1853-bd88.yml').read_bytes()).hexdigest()
        state={'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'research_head':git('rev-parse','HEAD',where=research),'research_tree':git('rev-parse','HEAD^{tree}',where=research),'sha256':hashes,'product_status':git('status','--porcelain','--untracked-files=all'),'research_status':git('status','--porcelain','--untracked-files=all',where=research)}
        (logs/'source-after-always.json').write_text(json.dumps(state,indent=2)+'\n')
        assert state['head']==os.environ['EXPECTED_PRODUCT_SHA'] and state['tree']==os.environ['EXPECTED_PRODUCT_TREE']
        assert state['research_head']==os.environ['EXPECTED_RESEARCH_SHA']
        assert not state['product_status'] and not state['research_status']
        before=json.loads((logs/'source-before.json').read_text())
        assert state['sha256']==before['sha256']
        assert state['research_tree']==before['research_tree']
        PY
    - name: Retain original apple qualification evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: research-pr1951-apple-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr1951-apple-logs/
        if-no-files-found: error
        retention-days: 14
  linux:
    needs: macos
    name: Linux isolated CLI HOST UI and bounded backend followups
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
    - name: Require natural User context and private fixture paths
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, pathlib, sys, tempfile
        logs=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-linux-logs'
        logs.mkdir(mode=0o700)
        names=sorted(name for name in os.environ if name.startswith('CAGENTS_'))
        (logs/'natural-context.json').write_text(json.dumps({'present_names':names})+'\n')
        if names:
            raise SystemExit('Natural User qualification refused: '+', '.join(names))
        fixture=pathlib.Path(tempfile.mkdtemp(prefix='c1951',dir='/tmp'))
        with open(os.environ['GITHUB_ENV'],'a') as env:
            print('EVIDENCE_DIR='+str(logs),file=env)
            print('CARGO_TARGET_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-linux-target'),file=env)
            print('TMPDIR='+str(fixture),file=env)
            for name,leaf in [('XDG_RUNTIME_DIR','runtime'),('XDG_DATA_HOME','data'),('XDG_CONFIG_HOME','config'),('XDG_CACHE_HOME','cache'),('XDG_STATE_HOME','state')]:
                (fixture/leaf).mkdir(mode=0o700)
                print(name+'='+str(fixture/leaf),file=env)
        PY
    - name: Check out research
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: research
        persist-credentials: false
    - name: Check out product
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ccb501ad4a65f726184d6e0d9aa5e7dc83d97825
        path: product
        persist-credentials: false
    - name: Check out receipt-product
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 5ad7985a56aaac5760cb71a6ea3d1ed2ba2c956a
        path: receipt-product
        persist-credentials: false
    - name: Check out fixture-product
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 32bc36da066bcf0cb614cff704a94c442279d3b1
        path: fixture-product
        persist-credentials: false
    - name: Bind exact product and research sources
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os,pathlib,subprocess
