name: Research native CLI and all isolated boundaries
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - .github/workflows/research-pr1853-bd88.yml
    - .github/scripts/pr1951*
permissions:
  contents: read
concurrency:
  group: research-pr1951-full-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.93.0
  EXPECTED_PRODUCT_SHA: 5ec1209b84b97ce56ea1e66cd1e4100f509b808c
  EXPECTED_PRODUCT_TREE: eef3ef6e2b916a83f8f8835b68d1c92c93a2e9db
jobs:
  macos:
    if: github.event.pull_request.head.ref == 'research/pr1853-bd88-qualification-20261028' && github.event.pull_request.head.repo.full_name
      == github.repository
    name: Native Apple ARM CLI link run and seventeen owning roots
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
    - name: Require natural User context and private fixture paths
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, pathlib, sys, tempfile
        logs=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-apple-logs'
        logs.mkdir(mode=0o700)
        names=sorted(name for name in os.environ if name.startswith('CAGENTS_'))
        (logs/'natural-context.json').write_text(json.dumps({'present_names':names})+'\n')
        if names:
            raise SystemExit('Natural User qualification refused: '+', '.join(names))
        fixture=pathlib.Path(tempfile.mkdtemp(prefix='c1951',dir='/tmp'))
        with open(os.environ['GITHUB_ENV'],'a') as env:
            print('EVIDENCE_DIR='+str(logs),file=env)
            print('CARGO_TARGET_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-apple-target'),file=env)
            print('TMPDIR='+str(fixture),file=env)
            for name,leaf in [('XDG_RUNTIME_DIR','runtime'),('XDG_DATA_HOME','data'),('XDG_CONFIG_HOME','config'),('XDG_CACHE_HOME','cache'),('XDG_STATE_HOME','state')]:
                (fixture/leaf).mkdir(mode=0o700)
                print(name+'='+str(fixture/leaf),file=env)
        PY
    - name: Check out research
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: research
        persist-credentials: 'false'
    - name: Check out product
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 5ec1209b84b97ce56ea1e66cd1e4100f509b808c
        path: product
        persist-credentials: 'false'
    - name: Bind exact product and research sources
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_source.py" before
    - name: Prepare and record native Apple toolchain
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64
        rustup toolchain install 1.93.0 --profile minimal
        { rustc -vV; cargo --version; sw_vers; uname -m; xcrun --show-sdk-path; cc --version; git --version; } > "$EVIDENCE_DIR/tools.txt"
        grep -Fx 'host: aarch64-apple-darwin' "$EVIDENCE_DIR/tools.txt"
    - name: Restore declared trusted warm target
      id: warm
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.CARGO_TARGET_DIR }}
        key: pr1951-full-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock') }}-${{
          github.event.pull_request.head.sha }}
        restore-keys: pr1951-full-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock')
          }}-
        fail-on-cache-miss: 'true'
    - name: Require warm target before any Cargo command
      env:
        MATCHED_CACHE_KEY: ${{ steps.warm.outputs.cache-matched-key }}
        EXPECTED_CACHE_PREFIX: pr1951-full-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock')
          }}-
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_cache.py"
    - name: Run literal apple qualification and retain every original exit
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_apple.py"
      id: qualification
    - name: Always retain and require unchanged literal source
      if: always()
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_source.py" after-always
    - name: Retain original apple qualification evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: research-pr1951-apple-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr1951-apple-logs/
        if-no-files-found: error
        retention-days: '14'
    - name: Save qualified target for a serial successor
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.CARGO_TARGET_DIR }}
        key: ${{ steps.warm.outputs.cache-primary-key }}
    env:
      EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
  linux:
    needs: macos
    if: github.event.pull_request.head.ref == 'research/pr1853-bd88-qualification-20261028' && github.event.pull_request.head.repo.full_name
      == github.repository
    name: Linux isolated CLI HOST and UI all-target boundaries
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: product
    steps:
    - name: Require natural User context and private fixture paths
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python3 - <<'SCRIPT'
        import json,os,pathlib,tempfile
        logs=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-full-linux-logs'
        logs.mkdir(mode=0o700)
        names=sorted(name for name in os.environ if name.startswith('CAGENTS_'))
        (logs/'natural-context.json').write_text(json.dumps({'present_names':names})+'\n')
        if names:raise SystemExit('Natural User qualification refused: '+', '.join(names))
        fixture=pathlib.Path(tempfile.mkdtemp(prefix='c1951full',dir='/tmp'))
        with open(os.environ['GITHUB_ENV'],'a') as env:
         print('EVIDENCE_DIR='+str(logs),file=env)
         print('CARGO_TARGET_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1951-full-target'),file=env)
         print('TMPDIR='+str(fixture),file=env)
         for name,leaf in [('XDG_RUNTIME_DIR','runtime'),('XDG_DATA_HOME','data'),('XDG_CONFIG_HOME','config'),('XDG_CACHE_HOME','cache'),('XDG_STATE_HOME','state')]:
          (fixture/leaf).mkdir(mode=0o700);print(name+'='+str(fixture/leaf),file=env)
        SCRIPT
    - name: Check out research
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: research
        persist-credentials: false
    - name: Check out product
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 5ec1209b84b97ce56ea1e66cd1e4100f509b808c
        path: product
        persist-credentials: false
    - name: Check out pinned Linux setup
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: c727f886628897c1749290213e9d65037253095a
        path: setup-main
        persist-credentials: false
    - name: Bind exact product control and setup sources
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_source.py" before
    - name: Install pinned Linux Rust and Zig setup
      uses: ./setup-main/.github/actions/setup-linux-build
    - name: Record literal build tools
      run: |
        set -euo pipefail
        rustup component add --toolchain 1.93.0 rustfmt
        { rustc -vV; cargo --version; rustfmt --version; zig version; git --version; } > "$EVIDENCE_DIR/tools.txt"
    - name: Restore declared trusted warm target
      id: warm
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.CARGO_TARGET_DIR }}
        key: pr1951-full-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock') }}-${{
          github.event.pull_request.head.sha }}
        restore-keys: pr1951-full-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock')
          }}-
        fail-on-cache-miss: 'true'
    - name: Require warm target before any Cargo command
      env:
        MATCHED_CACHE_KEY: ${{ steps.warm.outputs.cache-matched-key }}
        EXPECTED_CACHE_PREFIX: pr1951-full-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock')
          }}-
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_cache.py"
    - name: Run all three isolated boundaries and retain original exits
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_linux.py"
      id: qualification
    - name: Always retain unchanged literal source
      if: always()
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
        FROZEN_HELPER_BASELINE: ${{ steps.qualification.outputs.frozen_helper }}
        QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/research/.github/scripts/pr1951_source.py" after-always
    - name: Retain original full qualification evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: research-pr1951-full-linux-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pr1951-full-linux-logs/
        if-no-files-found: error
        retention-days: 14
    - name: Save qualified target for a serial successor
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.CARGO_TARGET_DIR }}
        key: ${{ steps.warm.outputs.cache-primary-key }}
    env:
      EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
