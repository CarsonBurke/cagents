            assert count>=1, selector
            if selector!='fs_safety::directory_creation::tests::restrictive_umask_creation_uses_retained_descriptor':
                assert count==1, (selector,count)
        assert 'test update::tests::streaming_child_refuses_a_kernel_reused_original_pid ... ignored' in output
        print('All '+str(len(expected))+' strict Linux filesystem/supervision roots passed; nested self-exec output is nonadditive and ignored PID-reuse remains ignored.',flush=True)


        receipt=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'receipt-product'
        phase('receipt-cli-check',['cargo','check','--locked','--no-default-features','--bin','cagents'],cwd=receipt)
        receipt_output=phase('receipt-cli-all-targets',['cargo','test','--locked','--no-default-features','--all-targets','--','--test-threads=2','--color=never'],cwd=receipt)
        for selector in [
            'control::agents::tests::accepted_wait_recovery_keeps_device_routing_and_original_error_details',
            'accepted_wait_errors_retain_original_receipts_without_resubmission',
