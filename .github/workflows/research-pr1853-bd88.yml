    - name: Always retain and require unchanged literal source
      if: always()
      env:
        EXPECTED_RESEARCH_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os,pathlib,subprocess
        root=pathlib.Path.cwd()
        logs=pathlib.Path(os.environ['EVIDENCE_DIR'])
        def git(*args,where=root):
            return subprocess.check_output(['git',*args],cwd=where,text=True).strip()
        research=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'research'
        paths=['Cargo.toml', 'Cargo.lock', 'src/lib.rs', 'src/modules.rs', '.cargo/config.toml', 'scripts/build-ceditor-product', 'src/chat/attachment_assets.rs', 'src/control.rs', 'src/daemon.rs', 'src/daemon/holder_registry/connection.rs', 'src/fs_safety.rs', 'src/fs_safety/darwin.rs', 'src/fs_safety/directory_creation.rs', 'src/fs_safety/linux.rs', 'src/host/client.rs', 'src/install_guard.rs', 'src/instance.rs', 'src/instance/daemon_admission.rs', 'src/update.rs', 'src/update/source.rs', 'src/worktree_setup.rs', 'src/worktree_cleanup.rs']
        hashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in paths}
        hashes['research-workflow']=hashlib.sha256((research/'.github/workflows/research-pr1853-bd88.yml').read_bytes()).hexdigest()
        state={'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'research_head':git('rev-parse','HEAD',where=research),'research_tree':git('rev-parse','HEAD^{tree}',where=research),'sha256':hashes,'product_status':git('status','--porcelain','--untracked-files=all'),'research_status':git('status','--porcelain','--untracked-files=all',where=research)}
        (logs/'source-after-always.json').write_text(json.dumps(state,indent=2)+'\n')
        assert state['head']==os.environ['EXPECTED_PRODUCT_SHA'] and state['tree']==os.environ['EXPECTED_PRODUCT_TREE']
        assert state['research_head']==os.environ['EXPECTED_RESEARCH_SHA']
        assert not state['product_status'] and not state['research_status']
        before=json.loads((logs/'source-before.json').read_text())
        assert state['sha256']==before['sha256']
        assert state['research_tree']==before['research_tree']

        companions={
            'receipt-product': ('EXPECTED_RECEIPT_SHA','EXPECTED_RECEIPT_TREE',['Cargo.toml','Cargo.lock','src/control/agents.rs','tests/cli_list_contracts.rs']),
            'fixture-product': ('EXPECTED_FIXTURE_SHA','EXPECTED_FIXTURE_TREE',['Cargo.toml','Cargo.lock','src/git_watch.rs','src/chat/native_holder/transport.rs']),
        }
        companion_state={}
        for folder,(head_name,tree_name,paths) in companions.items():
            checkout=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/folder
            state={'head':git('rev-parse','HEAD',where=checkout),'tree':git('rev-parse','HEAD^{tree}',where=checkout),'status':git('status','--porcelain','--untracked-files=all',where=checkout),'sha256':{name:hashlib.sha256((checkout/name).read_bytes()).hexdigest() for name in paths}}
            companion_state[folder]=state
        (logs/'companions-after-always.json').write_text(json.dumps(companion_state,indent=2)+'\n')
        for folder,(head_name,tree_name,_) in companions.items():
            state=companion_state[folder]
            assert state['head']==os.environ[head_name] and state['tree']==os.environ[tree_name] and not state['status'], state
        assert companion_state==json.loads((logs/'companions-before.json').read_text())
        PY
