jobs:
  select-case:
    if: >-
      github.event.pull_request.head.ref == 'research/pr1853-bd88-qualification-20261028' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Select one immutable research case
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      case: ${{ steps.select.outputs.case }}
    env:
      PR2015_CASE_SHA256: b266005f09f40ef1f9a41a5aa8073830e5451711b697273b13e7a3a5e44e9092
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: research
          persist-credentials: false
      - name: Verify source selector and select exactly one case
        id: select
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' a8f84fe3efb6b4113cded99e142108e64aef8986b7dc24b97fda69a3981ad014 research/.github/qualification/pr2015/case-select.py | sha256sum --check --strict
          python3 research/.github/qualification/pr2015/case-select.py
      - name: Upload original source-selection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-case-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue2015-hosted-evidence
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: select-case
    if: >-
      needs.select-case.outputs.case == 'legacy-final-save-1726' &&
      github.event.pull_request.head.ref == 'research/pr1853-bd88-qualification-20261028' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: One exact UI final-save diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Require natural hosted User context and initialize evidence
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/final-save-diagnostic-evidence"
          install -d -m 700 "$evidence_root"
          printf '%s\n' "FINAL_SAVE_DIAGNOSTIC_EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "final-save-diagnostic-evidence"
          present = sorted(name for name in os.environ if name.startswith("CAGENTS_"))
          (root / "context.json").write_text(json.dumps({
              "hosted": os.environ.get("GITHUB_ACTIONS") == "true",
              "inherited_cagents_names": present,
              "policy": "Presence only; no values inspected, removed or replaced."
          }, indent=2) + "\n")
          if os.environ.get("GITHUB_ACTIONS") != "true" or present:
              print("Natural hosted User context required; present names: " + ", ".join(present), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Check out the exact research control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: research
          persist-credentials: false

      - name: Check out the pinned main setup
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b855d789f2609cf16870951b5e92914f66843fc4
          path: setup-main
          persist-credentials: false

      - name: Check out exact PR 1726
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bc80ba61f9d1a5de02cb570902d3b55fb024a230
          path: product-1726
          persist-credentials: false

      - name: Verify every literal source and setup before compilation
        env:
          EXPECTED_CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["FINAL_SAVE_DIAGNOSTIC_EVIDENCE_ROOT"])
          manifest_text = os.environ["FINAL_SAVE_DIAGNOSTIC_MANIFEST"]
          manifest = json.loads(manifest_text)
          (evidence / "manifest.json").write_text(manifest_text)
          def git(root, *args):
              return subprocess.check_output(["git", "--no-optional-locks", "-C", str(root), *args], text=True).strip()
          def source(root, head, tree):
              result = {"head": git(root, "rev-parse", "HEAD"), "tree": git(root, "rev-parse", "HEAD^{tree}"),
                        "status": git(root, "status", "--porcelain=v1", "--untracked-files=all")}
              assert result == {"head": head, "tree": tree, "status": ""}, result
              assert not any(line.startswith("160000 ") for line in git(root, "ls-files", "--stage").splitlines()), "unexpected submodule"
              return result
          control = workspace / "research"
          assert git(control, "rev-parse", "HEAD") == os.environ["EXPECTED_CONTROL_SHA"]
          assert git(control, "status", "--porcelain=v1", "--untracked-files=all") == ""
          records = {"control_head": git(control, "rev-parse", "HEAD"),
                     "control_tree": git(control, "rev-parse", "HEAD^{tree}"),
                     "workflow_sha256": hashlib.sha256((control / ".github/workflows/research-pr1853-bd88.yml").read_bytes()).hexdigest(),
                     "setup": source(workspace / "setup-main", manifest["setup_head"], manifest["setup_tree"]),
                     "products": {}}
          action = workspace / "setup-main/.github/actions/setup-linux-build/action.yml"
          assert hashlib.sha256(action.read_bytes()).hexdigest() == manifest["setup_sha256"]
          assert manifest["never_merge"] is True
          assert [p["pr"] for p in manifest["products"]] == [1726]
          assert [lane["id"] for lane in manifest["lanes"]] == ["1726-ui"]
          assert [len(lane["selectors"]) for lane in manifest["lanes"]] == [2]
          selected = [name for lane in manifest["lanes"] for name in lane["selectors"]]
          assert len(selected) == len(set(selected)) == 2
          for lane in manifest["lanes"]:
              assert lane["feature"] == "ui" and lane["binary"] == "cagents-ui"
              assert lane["matched_helper"] is False
          for product in manifest["products"]:
              names = [name for lane in manifest["lanes"] if lane["pr"] == product["pr"] for name in lane["selectors"]]
              assert sorted(names) == sorted(product["selectors"])
          for product in manifest["products"]:
              names = product["selectors"] + [name for suite in product.get("suites", []) for name in suite["selectors"]]
              assert len(names) == len(set(names)), "no parent may run twice"
              assert set(product.get("owning_selectors", product["selectors"])).issubset(names)
          for product in manifest["products"]:
              root = workspace / ("product-" + str(product["pr"]))
              record = source(root, product["head"], product["tree"])
              paths = ["Cargo.toml", "Cargo.lock", "src/lib.rs", "src/modules.rs", *product["source_paths"]]
              record["source_sha256"] = {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in paths}
              assert record["source_sha256"] == product["source_sha256"], "immutable source hashes differ"
              for selector, path in product["selector_sources"].items():
                  leaf = selector.rsplit("::", 1)[1]
                  assert len(re.findall(r"\bfn\s+" + re.escape(leaf) + r"\s*\(", (root / path).read_text())) == 1
              records["products"][str(product["pr"])] = record
          (evidence / "sources-before.json").write_text(json.dumps(records, indent=2) + "\n")
          PY

      - name: Install the pinned main Linux Rust and Zig setup
        uses: ./setup-main/.github/actions/setup-linux-build

      - name: Retain the pinned build tools
        run: |
          set -euo pipefail
          {
            rustc -vV
            cargo --version
            zig version
            clang --version
            git --version
            timeout --version
          } > "$FINAL_SAVE_DIAGNOSTIC_EVIDENCE_ROOT/tools.txt"

      - name: Check and run the exact UI diagnostic serially
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, subprocess, tempfile, time
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["FINAL_SAVE_DIAGNOSTIC_EVIDENCE_ROOT"])
          manifest = json.loads((evidence / "manifest.json").read_text())
          results = []
          outcomes = []
          class ProductFailure(RuntimeError):
              def __init__(self, label, message):
                  self.label = label
                  super().__init__(message)
          def put(path, value):
              path.write_text(json.dumps(value, indent=2) + "\n")
          def digest(path):
              value = hashlib.sha256()
              with pathlib.Path(path).open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          def result(global_error=None):
              if global_error is not None:
                  for outcome in outcomes:
                      if outcome["status"] == "running":
                          outcome.update(status="stopped_globally", unrun_selector_invocations=None)
              grouped = []
              for product in manifest["products"]:
                  observed = [outcome for outcome in outcomes if outcome["pr"] == product["pr"]]
                  requested = [lane for lane in manifest["lanes"] if lane["pr"] == product["pr"]]
                  status = "passed" if len(observed) == len(requested) and all(o["status"] == "passed" for o in observed) else "incomplete"
                  if any(o["status"] in ("failed", "stopped_globally") for o in observed):
                      status = "failed"
                  grouped.append({"pr": product["pr"], "head": product["head"], "status": status,
                                  "qualified_parents": [name for outcome in observed for name in outcome["qualified_parents"]]})
              passed = len(outcomes) == len(manifest["lanes"]) and all(o["status"] == "passed" for o in outcomes)
              value = {"narrow_qualification": "passed" if passed and global_error is None else "failed",
                       "stopped_globally": global_error is not None, "error": global_error,
                       "completed_phases": len(results), "lanes": outcomes, "products": grouped,
                       "unattempted_lanes": [lane["id"] for lane in manifest["lanes"] if lane["id"] not in {o["id"] for o in outcomes}],
                       "qualified_parent_count": sum(len(o["qualified_parents"]) for o in outcomes),
                       "requested_parent_count": sum(len(lane["selectors"]) for lane in manifest["lanes"]),
                       "requested_check_count": len(manifest["lanes"]), "limits": manifest["limits"]}
              put(evidence / "result.json", value)
              return value
          def git(root, *args):
              return subprocess.check_output(["git", "--no-optional-locks", "-C", str(root), *args], text=True).strip()
          def verify(root, product):
              assert git(root, "rev-parse", "HEAD") == product["head"]
              assert git(root, "rev-parse", "HEAD^{tree}") == product["tree"]
              assert git(root, "status", "--porcelain=v1", "--untracked-files=all") == ""
              assert {name: digest(root / name) for name in product["source_sha256"]} == product["source_sha256"], "source hashes changed"
          def configuration(root, env):
              candidates = {parent / ".cargo" / name for parent in [root, *root.parents] for name in ["config", "config.toml"]}
              cargo_home = pathlib.Path(env.get("CARGO_HOME", str(pathlib.Path(env["HOME"]) / ".cargo"))).resolve()
              candidates.update(cargo_home / name for name in ["config", "config.toml"])
              files = {}
              for path in sorted(candidates):
                  try:
                      metadata = path.lstat()
                  except FileNotFoundError:
                      files[str(path)] = {"present": False}
                      continue
                  assert path.is_file(), "Cargo config is not a readable regular file: " + str(path)
                  files[str(path)] = {"present": True, "sha256": digest(path), "mode": metadata.st_mode,
                                      "symlink": os.readlink(path) if path.is_symlink() else None}
              explicit = {"PATH", "HOME", "CARGO_HOME", "CARGO_TARGET_DIR", "CARGO_INCREMENTAL", "RUSTC", "RUSTC_WRAPPER",
                          "RUSTC_WORKSPACE_WRAPPER", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "RUSTDOCFLAGS",
                          "CARGO_ENCODED_RUSTDOCFLAGS", "RUSTUP_TOOLCHAIN", "CC", "CXX", "AR", "LD",
                          "LIBCLANG_PATH", "LD_LIBRARY_PATH", "PKG_CONFIG_PATH", "PKG_CONFIG_LIBDIR", "PKG_CONFIG_SYSROOT_DIR"}
              inputs = {name: hashlib.sha256(value.encode()).hexdigest() for name, value in env.items()
                        if name in explicit or name.startswith(("CARGO_BUILD_", "CARGO_TARGET_", "CARGO_PROFILE_", "CC_", "CXX_", "AR_"))}
              return {"cargo_configs": files, "build_environment_sha256": inputs,
                      "scope": "Input names and hashes only; no credential values or inherited authority are disclosed or changed."}
          def phase(product, label, command, env, selector=None, expected_names=None, inventory_names=None, helper=None):
              root = workspace / ("product-" + str(product["pr"]))
              verify(root, product)
              assert configuration(root, env) == baseline_context, "Cargo configuration or build environment changed"
              assert helper is None, "This diagnostic never accepts a helper"
              expected_names_present = set()
              assert {name for name in env if name.startswith("CAGENTS_")} == expected_names_present, "unexpected inherited authority or helper context"
              output = evidence / (active_lane["id"] + "-" + label)
              output.mkdir()
              bounded = ["timeout", "--signal=TERM", "--kill-after=30s", "2700s", *command]
              record = {"source": product, "lane": active_lane, "label": label, "selector": selector, "cwd": str(root), "command": command,
                        "expected_names": expected_names, "inventory_names": inventory_names, "matched_helper": helper,
                        "bounded_command": bounded, "command_bound_seconds": 2700,
                        "started_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        "status": "running", "fixture_root": env["TMPDIR"],
                        "target_dir": env["CARGO_TARGET_DIR"],
                        "completion_scope": "GNU timeout wrapper/direct wait only; no detached-family closure claim."}
              put(output / "command.json", record)
              print("START", product["pr"], label, flush=True)
              start = time.monotonic()
              with (output / "stdout.log").open("wb") as stdout, (output / "stderr.log").open("wb") as stderr:
                  completed = subprocess.run(bounded, cwd=root, env=env, stdout=stdout, stderr=stderr)
              status = completed.returncode
              record.update(status="returned", wrapper_exit=status, direct_wait_complete=True,
                            wall_seconds=time.monotonic() - start)
              record["command_exit"] = status if 0 <= status < 124 else None
              record["timeout_or_wrapper_failure"] = status >= 124 or status < 0
              record["stdout_sha256"] = hashlib.sha256((output / "stdout.log").read_bytes()).hexdigest()
              record["stderr_sha256"] = hashlib.sha256((output / "stderr.log").read_bytes()).hexdigest()
              put(output / "command.json", record)
              (output / "exit.txt").write_text(str(status) + "\n")
              results.append(record)
              put(evidence / "phases.json", results)
              print("RETURN", product["pr"], label, "exit", status, flush=True)
              verify(root, product)
              assert configuration(root, env) == baseline_context, "Cargo configuration or build environment changed"
              assert helper is None, "This diagnostic never accepts a helper"
              expected_names_present = set()
              assert {name for name in env if name.startswith("CAGENTS_")} == expected_names_present, "unexpected inherited authority or helper context"
              if record["timeout_or_wrapper_failure"]:
                  raise RuntimeError(f"PR {product['pr']} {label}: uncertain timeout/signal/wrapper outcome; stop globally")
              if status != 0:
                  raise ProductFailure(label, f"PR {product['pr']} {label} failed with exit {status}; preserve original logs, no retry")
              if inventory_names is not None:
                  text = (output / "stdout.log").read_text() + "\n" + (output / "stderr.log").read_text()
                  names = re.findall(r"^(\S+): test$", text, re.M)
                  if not inventory_names or sorted(names) != sorted(inventory_names):
                      raise ProductFailure(label, f"Compiled test inventory differs: expected={inventory_names}, actual={names}")
                  put(output / "inventory.json", {"names": names, "count": len(names), "execution": "list only; no parent pass claimed"})
              if selector or expected_names is not None:
                  text = (output / "stdout.log").read_text() + "\n" + (output / "stderr.log").read_text()
                  names = re.findall(r"^test (\S+) \.\.\. ok$", text, re.M)
                  summaries = re.findall(r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;", text, re.M)
                  expected = [selector] if selector else expected_names
                  if not expected or sorted(names) != sorted(expected) or summaries != [("ok", str(len(expected)), "0", "0")]:
                      raise ProductFailure(label, f"Parent oracle failed: expected={expected}, names={names}, summaries={summaries}")
                  put(output / ("exact-parent.json" if selector else "suite-parents.json"),
                      {"names": names, "passed": len(names), "failed": 0, "ignored": 0})
              return output
          try:
              assert not any(name.startswith("CAGENTS_") for name in os.environ)
              for lane in manifest["lanes"]:
                  product = next(p for p in manifest["products"] if p["pr"] == lane["pr"])
                  active_lane, active_product = lane, product
                  assert lane["feature"] == "ui" and lane["binary"] == "cagents-ui"
                  fixture = pathlib.Path(tempfile.mkdtemp(prefix="rp", dir="/tmp"))
                  fixture.chmod(0o700)
                  env = os.environ.copy()
                  env["TMPDIR"] = str(fixture)
                  for key, leaf in [("XDG_RUNTIME_DIR", "run"), ("XDG_DATA_HOME", "data"), ("XDG_CONFIG_HOME", "config"), ("XDG_CACHE_HOME", "cache"), ("XDG_STATE_HOME", "state")]:
                      directory = fixture / leaf
                      directory.mkdir(mode=0o700)
                      env[key] = str(directory)
                  env["CARGO_TARGET_DIR"] = str(pathlib.Path(os.environ["RUNNER_TEMP"]) / ("final-save-diagnostic-target-" + lane["feature"]))
                  env["CARGO_BUILD_JOBS"] = "2"
                  root = workspace / ("product-" + str(product["pr"]))
                  baseline_context = configuration(root, env)
                  put(evidence / (lane["id"] + "-build-context.json"), baseline_context)
                  outcome = {"id": lane["id"], "pr": product["pr"], "head": product["head"], "feature": lane["feature"],
                             "status": "running", "check": "unrun", "qualified_parents": [],
                             "unrun_selector_invocations": list(lane["selectors"])}
                  outcomes.append(outcome)
                  result()
                  feature_arguments = [] if lane["feature"] == "cli" else ["--features", lane["feature"]]
                  try:
                      outcome["check"] = "running"
                      phase(product, "check", ["cargo", "check", "--locked", "--no-default-features", *feature_arguments, "--bin", lane["binary"]], env)
                      outcome["check"] = "passed"
                      for index, selector in enumerate(lane["selectors"], 1):
                          command = ["cargo", "test", "--locked", "--no-default-features", *feature_arguments, "--lib", selector]
                          phase(product, f"list-{index}", command + ["--", "--exact", "--list", "--color=never"], env, inventory_names=[selector])
                          outcome["unrun_selector_invocations"].remove(selector)
                          observed = phase(product, f"parent-{index}", command + ["--", "--exact", "--nocapture", "--test-threads=1", "--color=never"], env, selector)
                          outcome["qualified_parents"].extend(json.loads((observed / "exact-parent.json").read_text())["names"])
                      outcome["status"] = "passed"
                  except ProductFailure as error:
                      outcome.update(status="failed", failed_phase=error.label, error=str(error))
                      if error.label == "check":
                          outcome["check"] = "failed"
                      print("LANE FAILED", lane["id"], str(error), flush=True)
                  result()
          except BaseException as error:
              result(global_error=str(error))
              raise
          if result()["narrow_qualification"] != "passed":
              raise SystemExit(1)
          PY

      - name: Retain final source state even after a failed phase
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "final-save-diagnostic-evidence"
          evidence.mkdir(mode=0o700, exist_ok=True)
          expected = evidence / "manifest.json"
          if not expected.exists():
              (evidence / "sources-after.json").write_text(json.dumps({"audit": "unavailable before source preflight"}) + "\n")
              raise SystemExit(0)
          manifest = json.loads(expected.read_text())
          records, failures = {}, []
          for product in manifest["products"]:
              root = workspace / ("product-" + str(product["pr"]))
              record = {}
              for label, args in [("head", ["rev-parse", "HEAD"]), ("tree", ["rev-parse", "HEAD^{tree}"]),
                                  ("status", ["status", "--porcelain=v1", "--untracked-files=all"])]:
                  result = subprocess.run(["git", "--no-optional-locks", "-C", str(root), *args], capture_output=True, text=True)
                  record[label] = {"exit": result.returncode, "stdout": result.stdout.strip(), "stderr": result.stderr}
              records[str(product["pr"])] = record
              if any(item["exit"] != 0 for item in record.values()) or record["head"]["stdout"] != product["head"] or record["tree"]["stdout"] != product["tree"] or record["status"]["stdout"]:
                  failures.append(product["pr"])
          (evidence / "sources-after.json").write_text(json.dumps({"products": records, "failures": failures}, indent=2) + "\n")
          assert not failures, failures
          PY

      - name: Retain original raw qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-save-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/final-save-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 14

  installer2015:
    needs: select-case
    if: >-
      needs.select-case.outputs.case == 'installer2015' &&
      github.event.pull_request.head.ref == 'research/pr1853-bd88-qualification-20261028' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Research installer2015 hosted User CLI qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PR2015_CASE_SHA256: b266005f09f40ef1f9a41a5aa8073830e5451711b697273b13e7a3a5e44e9092
    defaults:
      run:
        shell: bash
    steps:
      - name: Require natural hosted User context before source setup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'issue2015-hosted-evidence'
          evidence.mkdir(mode=0o700, exist_ok=True)
          inherited_scope_present = any(name.startswith('CAGENTS_') for name in os.environ)
          record = {'outcome': 'failed', 'CAGENTS_scope_present': inherited_scope_present,
                    'scope_values_read': False, 'environment_stripped': False,
                    'engine_metadata_is_not_authenticated_RAW_proof': True}
          try:
              assert not inherited_scope_present, 'Inherited CAGENTS scope is unsupported; no environment changes made'
              assert os.environ.get('GITHUB_ACTIONS') == 'true'
              assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
              assert os.environ.get('RUNNER_OS') == 'Linux' and os.environ.get('RUNNER_ARCH') == 'X64'
              assert os.environ.get('GITHUB_EVENT_NAME') == 'pull_request' and platform.system() == 'Linux'
              record['outcome'] = 'success'
          finally:
              with (evidence / 'natural-context.json').open('x') as stream:
                  json.dump(record, stream, indent=2)
                  stream.write('\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: research
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 375c37ff01aab0b226c58f547012af74e93a8643
          path: product
          persist-credentials: false
      - name: Require exact product source and genuine independent controller review
        id: source_preflight
        run: |
          set -euo pipefail
          printf '%s  %s\n' a8f84fe3efb6b4113cded99e142108e64aef8986b7dc24b97fda69a3981ad014 research/.github/qualification/pr2015/case-select.py | sha256sum --check --strict
          python3 research/.github/qualification/pr2015/case-select.py --require-installer-review
      - name: Install pinned compiler without invoking Cargo
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 600s rustup toolchain install 1.93.0 --profile minimal > "$QUALIFICATION_EVIDENCE/rustup.stdout" 2> "$QUALIFICATION_EVIDENCE/rustup.stderr"
          setup_exit=$?
          set -e
          printf '%s\n' "$setup_exit" > "$QUALIFICATION_EVIDENCE/rustup.original-exit"
          exit "$setup_exit"
      - name: Restore only the existing trusted Main15 hosted namespace
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: held1922-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock') }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            held1922-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock') }}-
      - name: Admit actual existing CLI feature-empty cache before any Cargo
        id: warm_cache
        if: ${{ !cancelled() && steps.cache.outcome != 'skipped' }}
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          CACHE_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
          CACHE_LOCK_HASH: ${{ hashFiles('product/Cargo.lock') }}
        run: |
          python3 research/.github/qualification/pr2015/cache-restore-gate.py "$GITHUB_WORKSPACE/product"
      - name: Install bounded CLI native dependencies after warm admission
        if: ${{ success() && steps.warm_cache.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 1200s bash -c 'set -euo pipefail; sudo apt-get update; sudo apt-get install --yes --no-install-recommends build-essential clang cmake curl git libclang-dev libdbus-1-dev libssl-dev ninja-build pkg-config python3 xz-utils' > "$QUALIFICATION_EVIDENCE/native-setup.stdout" 2> "$QUALIFICATION_EVIDENCE/native-setup.stderr"
          setup_exit=$?
          set -e
          printf '%s\n' "$setup_exit" > "$QUALIFICATION_EVIDENCE/native-setup.original-exit"
          test "$setup_exit" -eq 0
          test -x /usr/bin/clang
          test -x /usr/bin/clang++
          test -d /usr/lib/llvm-14/lib
          printf '%s\n' 'CC=/usr/bin/clang' 'CXX=/usr/bin/clang++' 'LIBCLANG_PATH=/usr/lib/llvm-14/lib' >> "$GITHUB_ENV"
      - name: Execute one original ten-phase CLI-only packet
        id: cli
        if: ${{ success() && steps.warm_cache.outcome == 'success' }}
        run: |
          python3 "$GITHUB_WORKSPACE/research/.github/qualification/pr2015/installer-custody-runner.py" \
            --run-binding "$PR2015_RUN_BINDING" \
            --runner-sha256 c02b8bfa407d709c696a87ca2ec65c91a2d9f86808dafd70a41c228382baacb8 \
            --controller-review "$GITHUB_WORKSPACE/research/.github/qualification/pr2015/installer-custody-review.json" \
            --controller-review-sha256 "$PR2015_CONTROLLER_REVIEW_SHA256"
      - name: Preserve original workflow step outcomes and artifact checksums
        if: always()
        env:
          SOURCE_PREFLIGHT_OUTCOME: ${{ steps.source_preflight.outcome }}
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          WARM_CACHE_OUTCOME: ${{ steps.warm_cache.outcome }}
          CLI_PACKET_OUTCOME: ${{ steps.cli.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'issue2015-hosted-evidence'
          root.mkdir(mode=0o700, exist_ok=True)
          record = {'outcomes': {name: os.environ[name] for name in (
              'SOURCE_PREFLIGHT_OUTCOME', 'CACHE_RESTORE_OUTCOME', 'WARM_CACHE_OUTCOME', 'CLI_PACKET_OUTCOME')},
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_job_terminal': 'NOT_YET_TERMINAL_POST_ACTIONS_PENDING',
              'global_C_return': 'NOT_MADE_BY_WORKFLOW',
              'external_original_GitHub_job_log_ZIP_and_sole_RAW_required': True,
              'native_provider_installed_and_whole_PR_claims': 'NONE'}
          with (root / 'workflow-step-outcomes.json').open('x') as stream:
              json.dump(record, stream, indent=2)
              stream.write('\n')
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and not path.is_symlink() and path.name != 'sha256.txt':
                  rows.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + str(path.relative_to(root)))
          with (root / 'sha256.txt').open('x') as stream:
              stream.write('\n'.join(rows) + '\n')
          PY
      - name: Upload full original controller ledger and compact terminal receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer2015-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue2015-hosted-evidence
          if-no-files-found: error
          retention-days: 14

