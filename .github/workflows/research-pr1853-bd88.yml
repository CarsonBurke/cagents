        phase('linux-host-check',['cargo','check','--locked','--no-default-features','--features','host','--bin','cagentsd'])
        for index, selector in enumerate(['worktree_setup::tests::anonymous_copy_publishes_the_owned_inode_and_never_cleans_foreign_names', 'worktree_setup::tests::anonymous_copy_preserves_mode_under_restrictive_umask', 'worktree_setup::tests::changed_source_cannot_publish_new_private_bytes_with_old_permissions', 'worktree_setup::tests::source_changes_after_permission_application_refuse_publication', 'worktree_setup::tests::copy_preserves_restrictive_access_acl_and_removes_inherited_acl'], 1):
            output = exact("linux-host-parent-%02d" % index,selector,"host")
            if selector.endswith("::copy_preserves_restrictive_access_acl_and_removes_inherited_acl"):
                assert "SETUP_ACL_COPY_VERIFIED" in output
                assert "SETUP_ACL_FIXTURE_UNSUPPORTED" not in output


        fixtures=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'fixture-product'
        phase('fixture-host-check',['cargo','check','--locked','--no-default-features','--features','host','--bin','cagentsd'],cwd=fixtures)
        for index,selector in enumerate([
            'chat::native_holder::transport::tests::post_child_census_failure_preserves_live_ownership_and_services_control',
            'chat::native_holder::transport::tests::idle_reaping_preserves_a_live_provider_and_its_live_adopted_tool',
            'git_watch::tests::native_watcher_observes_atomic_replacement_and_recreated_directory',
        ],1):
            exact('fixture-host-parent-%02d'%index,selector,'host',cwd=fixtures)

        phase('linux-ui-check',['cargo','check','--locked','--no-default-features','--features','ui','--bin','cagents-ui'])
