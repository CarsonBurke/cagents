        phase('linux-cli-check',['cargo','check','--locked','--no-default-features','--bin','cagents'])
        output=phase('linux-cli-all-targets',['cargo','test','--locked','--no-default-features','--all-targets','--','--test-threads=2','--color=never'])
        expected=['fs_safety::tests::a_root_reports_its_own_identity', 'fs_safety::tests::a_relative_path_resolves_and_reads', 'fs_safety::tests::a_symlinked_final_component_is_rejected', 'fs_safety::tests::a_symlinked_intermediate_component_is_rejected', 'fs_safety::tests::an_absolute_path_and_a_parent_component_are_rejected', 'fs_safety::tests::metadata_beneath_describes_a_symlink_as_itself', 'fs_safety::tests::exclusive_publication_preserves_existing_entries_and_dangling_links', 'fs_safety::tests::retained_directory_listing_and_permissions_ignore_replaced_names', 'fs_safety::tests::creation_modes_preserve_target_width_before_creating_entries', 'fs_safety::tests::a_temporary_file_is_renamed_over_its_target_atomically', 'fs_safety::tests::only_the_user_and_access_control_namespaces_are_reproduced', 'fs_safety::tests::a_fifo_opens_without_blocking_and_is_identifiable', 'fs_safety::directory_creation::tests::publication_retains_original_before_public_target_replacement', 'fs_safety::directory_creation::tests::different_parent_preserves_native_creation_as_unverified', 'fs_safety::directory_creation::tests::shared_namespace_returns_unverified_without_permission_claim', 'fs_safety::directory_creation::tests::restrictive_umask_creation_uses_retained_descriptor', 'fs_safety::directory_creation::tests::mode_restore_failure_keeps_published_identity_and_explicit_retry', 'fs_safety::directory_creation::tests::pending_mode_retry_preserves_observed_newer_public_permissions', 'fs_safety::directory_creation::tests::sticky_parent_effective_access_checks_the_retained_original_before_creation', 'fs_safety::directory_creation::tests::postpublication_cleanup_error_retains_cached_identity_and_stage', 'fs_safety::directory_creation::tests::failed_publication_retains_prepared_identity_and_retries_cleanup', 'update::tests::streaming_capture_failure_cleans_fresh_original_before_returning_error', 'update::tests::bounded_stream_preserves_success_and_size_failure', 'update::tests::bounded_stream_keeps_live_timeout_and_cancellation_cleanup', 'update::tests::streaming_child_observation_keeps_leader_until_final_cleanup', 'update::tests::streaming_signal_error_reaps_exited_leader_and_refuses_live_wait', 'update::tests::bounded_failed_stream_cleans_owned_descendants_after_exit', 'update::tests::a_failed_build_requires_a_later_matched_installation_to_be_superseded']
        for selector in expected:
