          record = {'outcomes': {name: os.environ[name] for name in ('SOURCE_PREFLIGHT_OUTCOME', 'PRODUCER_OUTCOME', 'SAVE_ACTION_OUTCOME')},
                    'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'cache_publication': 'UNQUALIFIED_PENDING_ORIGINAL_VENDOR_EXACT_KEY_CONFIRMATION',
                    'future_restore': 'UNQUALIFIED_REQUIRES_SEPARATE_ORIGINAL_INSTALLER_GATE',
                    'owning_passes': 0, 'installer_test_native_provider_invocations': 0,
                    'workflow_job_terminal': 'NOT_YET_TERMINAL_POST_ACTIONS_PENDING', 'global_C_return': 'NOT_MADE'}
