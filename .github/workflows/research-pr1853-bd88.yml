                      stream.write(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + str(path.relative_to(root)) + '\n')
          PY
      - name: Upload complete original producer evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-cache-producer2015-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue2015-hosted-evidence
          if-no-files-found: error
          retention-days: 14

  case-result:
    needs: [select-case, qualify, installer2015, cli-cache-producer-2015]
    if: always()
    name: Report the selected research case without transferring passes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      SELECTED_CASE: ${{ needs.select-case.outputs.case }}
      SELECT_RESULT: ${{ needs.select-case.result }}
      LEGACY_RESULT: ${{ needs.qualify.result }}
      INSTALLER_RESULT: ${{ needs.installer2015.result }}
      PRODUCER_RESULT: ${{ needs.cli-cache-producer-2015.result }}
    steps:
      - name: Require only the actual selected case and disclose the unrun case
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          selected = os.environ['SELECTED_CASE']
          legacy, installer = os.environ['LEGACY_RESULT'], os.environ['INSTALLER_RESULT']
          results = {'installer2015': installer, 'legacy-final-save-1726': legacy, 'cli-cache-producer-2015': os.environ['PRODUCER_RESULT']}
          selected_result = results.get(selected, 'unknown')
          others = {name: result for name, result in results.items() if name != selected}
          other_result = str(others)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Research only / NeverMerge. Selected case: ' + selected + '.\n\n')
              stream.write('Selected job result: ' + selected_result + '; other case: UNRUN (' + other_result + ').\n\n')
              stream.write('No native, provider, installed, external process absence, whole-PR or mergeability claim. Original authenticated run/job/log/artifact review and external C return remain required.\n')
          assert os.environ['SELECT_RESULT'] == 'success'
          assert selected_result == 'success', 'Selected case failed, was cancelled, skipped, or remained unknown'
          assert len(others) == 2 and all(result == 'skipped' for result in others.values()), 'More than the selected heavy case ran'
          if selected == 'cli-cache-producer-2015':
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
                  stream.write('CLI cache preparation only; zero test parents. Save-action success alone is not a saved-cache receipt or future restore guarantee. Original vendor exact-key confirmation and later separately granted installer restore/gate remain required.\n')
          PY
