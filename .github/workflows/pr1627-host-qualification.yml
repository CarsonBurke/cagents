name: Temporary PR1627 HOST qualification

on:
  push:
    branches: [research/pr1627-host-qualification-20261028]

permissions:
  contents: read

concurrency:
  group: pr1627-host-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.93.0

jobs:
  host-research:
    name: Serial natural-User HOST diagnostics contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Record the absolute budget before checkout or setup
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, time
          from pathlib import Path
          start = time.monotonic()
          deadline = start + 3000
          record = {"earliest_step_monotonic": start, "deadline_monotonic": deadline,
                    "total_budget_seconds": 3000, "nominal_job_reserve_seconds": 600}
          (Path(os.environ["RUNNER_TEMP"]) / "pr1627-job-budget.json").write_text(json.dumps(record) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"PR1627_JOB_START={start:.9f}\nPR1627_JOB_DEADLINE={deadline:.9f}\n")
          print("PR1627 absolute 50-minute budget recorded before checkout/setup; nominal 10-minute cleanup/upload reserve.")
          PY
      - name: Check out the exact research and source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.3'
      - name: Set up the qualified1871 Linux dependencies and toolchains
        uses: ./.github/actions/setup-linux-build
      - name: Prepare a private short runtime directory
        shell: bash
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d /tmp/caXXXXXX)
          install -d -m 700 "$fixture_root/runtime"
          printf '%s\n' "TMPDIR=$fixture_root" \
            "XDG_RUNTIME_DIR=$fixture_root/runtime" >> "$GITHUB_ENV"
      - name: Run the bounded HOST compiler and exact owning contracts
        run: python3 -I -B research/pr1627-host/run.py
      - name: Retain raw phase receipts and compiler/test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr1627-host-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr1627-host-results
            ${{ runner.temp }}/pr1627-job-budget.json
          if-no-files-found: warn
          retention-days: 14
