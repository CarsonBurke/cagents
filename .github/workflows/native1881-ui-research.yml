name: Temporary native1881 UI research

on:
  push:
    branches: [research/native1881-ui-20261028]

permissions:
  contents: read

concurrency:
  group: native1881-ui-research-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.93.0

jobs:
  fixture-research:
    name: Serial isolated UI and offline fixture contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact research and source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.3'
      - name: Set up the qualified1871 Linux dependencies and toolchains
        uses: ./.github/actions/setup-linux-build
      - name: Prepare a private short runtime directory
        shell: bash
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d /tmp/caXXXXXX)
          install -d -m 700 "$fixture_root/runtime"
          printf '%s\n' "TMPDIR=$fixture_root" \
            "XDG_RUNTIME_DIR=$fixture_root/runtime" >> "$GITHUB_ENV"
      - name: Run the exact bounded compiler and headless contracts
        run: python3 -I -B research/native1881-ui/run.py
      - name: Retain raw phase receipts and compiler/test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native1881-ui-research-${{ github.sha }}
          path: ${{ runner.temp }}/native1881-ui-results
          if-no-files-found: warn
          retention-days: 14
