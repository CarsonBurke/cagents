name: Qualify held saved scope

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: held-scope-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  user-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qual/held-saved-scope-fw16'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PRODUCT_SHA: 017ccd7f878abbb2fcad19d53e6ec2b6c426abc6
      PRODUCT_TREE: ef14211ef4051ca8e665adb890379b3ab2a532d6
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - name: Require a genuine hosted User context
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if [ "${CAGENTS_AGENT_AUTHORITY+x}" ]; then
            printf '%s\n' 'Refusing inherited caller authority; no environment changes were made.' >&2
            exit 77
          fi
          printf '%s\n' "CARGO_TARGET_DIR=$RUNNER_TEMP/held-scope-target" "QUALIFICATION_EVIDENCE=$RUNNER_TEMP/held-scope-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - name: Verify the pinned setup action
        shell: bash
        run: |
          printf '%s  %s\n' 82a5284e0640b3c6648e3b9b3d6e0e0b323ada03eb087cbf95b9b63ca3d0c052 control/.github/actions/setup-linux/action.yml | sha256sum --check --strict
      - uses: ./control/.github/actions/setup-linux
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c727f886628897c1749290213e9d65037253095a
          path: before
          persist-credentials: false
      - name: Install native evidence tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth x11-utils openbox dbus-x11 at-spi2-core python3-pyatspi python3-pil xdotool xclip imagemagick libxtst-dev libgl1-mesa-dri mesa-vulkan-drivers libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 adwaita-icon-theme fonts-noto-cjk
      - name: Restore the isolated hosted build lane
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: held1922-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock') }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            held1922-${{ runner.os }}-${{ runner.arch }}-rust193-${{ hashFiles('product/Cargo.lock') }}-
      - name: Check exact UI source and execute focused User regressions
        id: focus
        shell: bash
        run: python3 control/.github/qualification/held-scope.py "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/control" --focused-only
      - name: Capture actual native X11 before and after evidence
        id: native
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24 -nolisten tcp -dpi 96" dbus-run-session -- /usr/bin/python3 control/.github/qualification/native-driver.py "$GITHUB_WORKSPACE/control" "$GITHUB_WORKSPACE/before" "$GITHUB_WORKSPACE/product"
      - name: Upload native interaction evidence
        if: ${{ !cancelled() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: held-scope-${{ env.PRODUCT_SHA }}-${{ github.run_attempt }}-native
          path: ${{ runner.temp }}/held-scope-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Run every affected isolated suite after native cleanup
        if: ${{ !cancelled() && steps.focus.outcome == 'success' && (steps.native.outcome == 'success' || steps.native.outcome == 'failure') }}
        shell: bash
        run: |
          test -f "$QUALIFICATION_EVIDENCE/native/cleanup-complete"
          python3 -c 'import json, os; from pathlib import Path; p = Path(os.environ["QUALIFICATION_EVIDENCE"]) / "native/cleanup.json"; assert json.loads(p.read_text())["errors"] == []'
          python3 control/.github/qualification/held-scope.py "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/control" --suites-only
      - name: Recompute all artifact checksums
        if: always()
        shell: bash
        run: |
          if [ -d "$QUALIFICATION_EVIDENCE" ]; then
            cd "$QUALIFICATION_EVIDENCE"
            find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt
          fi
      - name: Upload source and validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: held-scope-${{ env.PRODUCT_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/held-scope-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the hosted lane after validation
        # Full native/three-boundary archives exceed the repository's 10 GB
        # ceiling. Preserve the existing 4.98 GB focus fallback instead of
        # replacing it with an archive that cannot remain cached.
        if: always() && steps.cache.outcome == 'success' && steps.native.outcome == 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache.outputs.cache-primary-key }}
