# Gradle runs on a shared machine (the build host; see scripts/gradle-remote):
# one bounded JVM that exits with the build. No Gradle daemon stays behind,
# and Kotlin compiles inside that JVM rather than in a separate daemon of
# its own.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
