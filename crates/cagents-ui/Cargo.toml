[package]
name = "cagents-ui"
version = "0.2.3"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[lints]
workspace = true

[features]
# The browserless UI. The packaged product selects `integrated-browser`.
default = []
development = ["cagents/development"]
# Experimental Linux-only UI iteration; never selected by production defaults.
hot-reload = ["development", "dep:iced_hot", "iced_hot/hot"]
# Opt-in local redraw-scheduling fixture; ordinary builds use a zero-state recorder.
latency-harness = ["cagents/latency-harness", "cagents-ui-kit/latency-harness"]
# Controlled registry tests only; never an ordinary UI dev-dependency.
browser-protocol-fixture = ["integrated-browser", "dep:wayland-server", "wayland-protocols/server"]
integrated-browser = [
    "cagents/integrated-browser",
    "cagents-ui-kit/integrated-browser",
    "dep:cagents-browser-import",
    "dep:cookie",
    "dep:net_traits",
    "dep:dpi",
    "dep:euclid",
    "dep:keyboard-types",
    "dep:raw-window-handle",
    "dep:servo",
    "dep:wayland-client",
    "dep:wayland-protocols",
]

[lib]
# The UI's tests live in the library; `cargo test -p cagents-ui --lib` runs them.
bench = false

[[bin]]
name = "cagents-ui"
path = "src/bin/cagents-ui.rs"
test = false
bench = false

[[bin]]
name = "cagents-ui-hot"
path = "src/hot-ui.rs"
test = false
bench = false
required-features = ["hot-reload"]

[dependencies]
cagents = { path = "../..", default-features = false, features = ["ui"] }
cagents-dictate = { path = "../cagents-dictate" }
# The widgets and views the application composes; see crates/cagents-ui-kit.
cagents-ui-kit = { path = "../cagents-ui-kit" }
cagents-browser-import = { path = "../browser-import", features = ["desktop-keyring"], optional = true }
cookie = { version = "0.18", optional = true }
net_traits = { package = "servo-net-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282", optional = true }
unicode-casefold = "0.2"
unicode-linebreak = "0.1"
unicode-segmentation = "1.13.3"
async-channel = "2.5"
base64 = "0.22"
blake3 = "1.8"
crossbeam-channel = "0.5"
dpi = { version = "=0.1.2", optional = true }
directories = "6.0"
euclid = { version = "=0.22.14", optional = true }
# Fast fixed-seed hashing of what the views draw (see `crates/cagents-ui-kit/src/fingerprint.rs`);
# already in the resolved graph through hashbrown.
foldhash = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
iced_accessibility = { git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d" }
# Exact same package/source as libcosmic's iced; only its hot feature is added.
iced_hot = { package = "iced", git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d", default-features = false, optional = true }
keyboard-types = { version = "=0.8.3", features = ["serde"], optional = true }
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d", default-features = false, features = ["a11y", "markdown", "multi-window", "surface-message", "tokio", "wgpu", "winit", "xdg-portal"] }
indexmap = "2.14"
libc = "0.2.189"
# Finds records worth parsing in large provider transcripts for the resume
# picker; already in the resolved graph through regex.
memchr = "2.7"
notify = "=9.0.0-rc.8"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
pulldown-cmark = { version = "0.12.2", default-features = false }
unicase = "2.9"
rusqlite = { version = "0.37", features = ["bundled"] }
jiff = "0.2.35"
raw-window-handle = { version = "=0.6.2", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
servo = { version = "=0.1.3", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282", default-features = false, features = ["baked-in-resources", "js_jit"], optional = true }
thiserror = "2.0"
tempfile = "3.21"
tokio = { version = "1.47", features = ["fs", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = { version = "1.1.4", features = ["preserve_order"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
wayland-server = { version = "=0.31.14", optional = true }
# Platform backends are explicit rather than inherited from iced/winit defaults.
# Match the common package identities so Cargo unifies widget/runtime features.
[target.'cfg(target_os = "linux")'.dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d", default-features = false, features = ["wayland", "x11"] }
# These system-backed protocols belong only to the integrated Linux browser.
wayland-client = { version = "=0.31.15", features = ["system"], optional = true }
wayland-protocols = { version = "=0.32.13", features = ["client"], optional = true }

[dev-dependencies]
# The shared library's test fixtures, which the UI's tests also use.
cagents = { path = "../..", default-features = false, features = ["ui", "test-support"] }
cagents-ui-kit = { path = "../cagents-ui-kit", features = ["test-support"] }
tokio = { version = "1.47", features = ["test-util"] }
