[package]
name = "cagents-browser-import"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[features]
desktop-keyring = ["dep:secret-service"]

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"], optional = true }
sha1 = "0.10"
sha2 = "0.10"
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["hooks"] }
tempfile = "3.21"
