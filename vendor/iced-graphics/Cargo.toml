[package]
name = "iced_graphics"
description = "A bunch of backend-agnostic types that can be leveraged to build a renderer for iced"
version = "0.14.0"
edition = "2024"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
license = "MIT"
repository = "https://github.com/iced-rs/iced"
homepage = "https://iced.rs"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]

[workspace]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
geometry = ["lyon_path"]
image = ["dep:image", "kamadak-exif"]
svg = []
web-colors = []
fira-sans = []

[dependencies]
iced_core = { git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d" }
iced_futures = { git = "https://github.com/pop-os/libcosmic.git", rev = "caec74c2559924443f12fc6faf97a5bcefe6271d" }

bitflags = "2.5"
bytemuck = { version = "1.0", features = ["derive"] }
cosmic-text = "0.19"
half = "2.2"
log = "0.4"
raw-window-handle = "0.6"
rustc-hash = "2.0"
thiserror = "2"
unicode-segmentation = "1.0"

image = { version = "0.25", default-features = false, optional = true }

kamadak-exif = { version = "0.6", optional = true }

lyon_path = { version = "1.0", optional = true }
