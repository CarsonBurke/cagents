[package]
name = "servo-script"
build = "build.rs"
version = "0.1.3"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
edition = "2024"
publish = true
rust-version = "1.86.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."

[lib]
name = "script"
path = "lib.rs"

[features]
bluetooth = ['servo-bluetooth-traits', 'script_bindings/bluetooth']
crown = ['js/crown']
debugmozjs = ['js/debugmozjs']
gamepad = ["script_bindings/gamepad", "embedder_traits/gamepad"]
jitspew = ['js/jitspew']
js_backtrace = []
js_jit = ["js/jit"]
profilemozjs = ['js/profilemozjs']
refcell_backtrace = ["accountable-refcell"]
testbinding = ["script_bindings/testbinding"]
tracing = ["dep:tracing", "script_bindings/tracing"]
webgl_backtrace = ["servo-canvas-traits/webgl_backtrace"]
webgpu = ["script_bindings/webgpu", "script_traits/webgpu"]
webxr = ["gamepad", "webxr-api", "script_bindings/webxr"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)'] }

[dependencies]
accountable-refcell = { version = "0.2.2", optional = true }
aes = { version = "0.8.4" }
aes-gcm = { version = "0.10.3" }
aes-kw = { version = "0.2.1", features = ["alloc"] }
app_units = { version = "0.7" }
argon2 = { version = "0.5", features = ["alloc"] }
arrayvec = { version = "0.7" }
atomic_refcell = { version = "0.1.13" }
aws-lc-rs = { version = "1.16.3", default-features = false, features = ["aws-lc-sys"] }
backtrace = { version = "0.3" }
base64 = { version = "0.22.1" }
base64ct = { version = "1.8", features = ["alloc"] }
bitflags = { version = "2.11" }
brotli = { version = "8.0.2" }
cbc = { version = "0.1.2" }
chacha20poly1305 = { version = "0.10" }
chardetng = { version = "0.1" }
chrono = { version = "0.4", features = ["serde"] }
cipher = { version = "0.4.4", features = ["alloc"] }
content-security-policy = { version = "0.8.0", features = ["serde"] }
cookie = { version = "0.18" }
crossbeam-channel = { version = "0.5" }
cssparser = { version = "0.36", features = ["serde"] }
ctr = { version = "0.9.2" }
data-url = { version = "0.3" }
deny_public_fields = { package = "servo-deny-public-fields", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
der = { version = "0.7", features = ["alloc", "derive"] }
devtools_traits = { package = "servo-devtools-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
digest = { version = "0.10" }
dom_struct = { package = "servo-dom-struct", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
ecdsa = { version = "0.16" }
elliptic-curve = { version = "0.13" }
embedder_traits = { package = "servo-embedder-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
encoding_rs = { version = "0.8", features = ["serde"] }
euclid = { version = "0.22" }
flate2 = { version = "1.1" }
fonts = { package = "servo-fonts", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
fonts_traits = { package = "servo-fonts-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
glow = { version = "0.16.0" }
headers = { version = "0.4" }
hkdf = { version = "0.12" }
html5ever = { version = "0.39" }
http = { version = "1.4" }
hyper_serde = { package = "servo-hyper-serde", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
icu_locid = { version = "1.5.0" }
indexmap = { version = "2.11.4", features = ["std"] }
ipc-channel = { version = "0.21" }
itertools = { version = "0.14" }
js = { package = "mozjs", version = "=0.15.18", default-features = false, features = ["libz-sys", "intl"] }
jstraceable_derive = { package = "servo-jstraceable-derive", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
keyboard-types = { version = "0.8.3", features = ["serde", "webdriver"] }
layout_api = { package = "servo-layout-api", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
libc = { version = "0.2" }
log = { version = "0.4.29" }
malloc_size_of = { package = "servo-malloc-size-of", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
malloc_size_of_derive = { version = "0.1" }
markup5ever = { version = "0.39" }
media = { package = "servo-media-thread", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
metrics = { package = "servo-metrics", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
mime = { version = "0.3.13" }
mime-multipart-hyper1 = { version = "0.10.0" }
mime_guess = { version = "2.0.5" }
ml-dsa = { version = "0.0.4" }
ml-kem = { version = "0.2", features = ["deterministic"] }
net_traits = { package = "servo-net-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
nom-rfc8288 = { version = "0.4.0" }
num-bigint-dig = { version = "0.8" }
num-traits = { version = "0.2" }
num_cpus = { version = "1.17.0" }
ocb3 = { version = "0.1.0" }
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", features = ["ecdh"] }
p521 = { version = "0.13", features = ["ecdh"] }
paint_api = { package = "servo-paint-api", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
parking_lot = { version = "0.12", features = ["serde"] }
percent-encoding = { version = "2.3" }
phf = "0.13"
pixels = { package = "servo-pixels", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
pkcs8 = { version = "0.10", features = ["rand_core"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
profile_traits = { package = "servo-profile-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
rand = { version = "0.9.5" }
regex = { version = "1.12" }
rsa = { version = "0.9.10", features = ["sha1", "sha2"] }
rustc-hash = { version = "2.1.2" }
script_bindings = { package = "servo-script-bindings", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
script_traits = { package = "servo-script-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
sec1 = { version = "0.7" }
selectors = { version = "0.36.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
servo-background-hang-monitor-api = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo-base = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo-bluetooth-traits = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282", optional = true }
servo-canvas-traits = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo-config = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo-constellation-traits = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo-geometry = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo-media = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo-url = { git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
servo_arc = { version = "0.4.3" }
sha1 = { version = "0.10" }
sha2 = { version = "0.10" }
sha3 = { version = "0.10" }
smallvec = { version = "1.15", features = ["serde", "union"] }
storage_traits = { package = "servo-storage-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
strum = { version = "0.28", features = ["derive"] }
stylo = { version = "0.15.0" }
stylo_atoms = { version = "0.15.0" }
stylo_dom = { version = "0.15.0" }
stylo_malloc_size_of = { version = "0.15.0" }
stylo_traits = { version = "0.15.0" }
swapper = "0.1"
tempfile = "3"
tendril = { version = "0.5", features = ["encoding_rs"] }
time = { version = "0.3", features = ["large-dates", "local-offset", "serde"] }
timers = { package = "servo-timers", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
tracing = { version = "0.1.44", optional = true }
unicode-bidi = { version = "0.3.18" }
unicode-script = { version = "0.5" }
url = { version = "2.5" }
urlpattern = { version = "0.3" }
uuid = { version = "1.23.0", features = ["v4", "v5", "serde"] }
webdriver = { version = "0.53.0" }
webgpu_traits = { package = "servo-webgpu-traits", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }
webrender_api = { version = "0.68" }
webxr-api = { package = "servo-webxr-api", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282", optional = true }
wgpu-core = { version = "26" }
wgpu-types = { version = "26" }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xml5ever = { version = "0.39" }
xpath = { package = "servo-xpath", git = "https://github.com/servo/servo.git", rev = "5c14ac9428d8d95c2f6c2f0300fe248d3929f282" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
mozangle = { version = "0.5.5" }

[workspace]
