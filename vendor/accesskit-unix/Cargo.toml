[package]
name = "accesskit_unix"
version = "0.18.0"
authors = ["The AccessKit contributors"]
license = "MIT OR Apache-2.0"
description = "AccessKit UI accessibility infrastructure: Linux adapter"
categories = ["gui"]
keywords = ["gui", "ui", "accessibility"]
repository = "https://github.com/AccessKit/accesskit"
readme = "README.md"
edition = "2021"
rust-version = "1.77.2"

[features]
default = ["async-io"]
async-io = ["dep:async-io", "dep:async-channel", "dep:async-executor", "dep:async-task", "dep:futures-util"]
tokio = ["dep:tokio", "dep:tokio-stream"]

[dependencies]
tracing = "0.1"
accesskit = { version = "0.22.0", git = "https://github.com/wash2/accesskit", tag = "cosmic-0.14" }
accesskit_atspi_common = { version = "0.15.0", path = "../accesskit-atspi-common" }
atspi = { version = "0.29", default-features = false, features = ["proxies"] }
futures-lite = "2.3"
serde = "1.0"
zbus = { version = "5.5", default-features = false, features = ["async-io"] }

# async-io support
async-io = { version = "2", optional = true }
async-channel = { version = "2.1.1", optional = true }
async-executor = { version = "1.5.0", optional = true }
async-task = { version = "4.3.0", optional = true }
futures-util = { version = "0.3.27", optional = true }

# tokio support
tokio-stream = { version = "0.1.14", optional = true }
[dependencies.tokio]
version = "1.32.0"
optional = true
features = ["macros", "net", "rt", "sync", "time"]
